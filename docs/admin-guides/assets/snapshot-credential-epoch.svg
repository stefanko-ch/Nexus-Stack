<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-label="Credential epoch: a snapshot teardown keeps the passwords and the snapshot stays restorable; a rebuild teardown regenerates them and older snapshots are refused" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Credential epoch: a snapshot teardown keeps the passwords and the snapshot stays restorable; a rebuild teardown regenerates them and older snapshots are refused</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="600" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Why an old snapshot can be refused</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">Never run the Rebuild teardown at a stack that lives on snapshots.</tspan></text><rect x="36" y="106" width="748" height="74" rx="14" fill="#161d24"/><rect x="36" y="106" width="6" height="74" rx="3" fill="#4aa8ff"/><text x="60" y="136" font-size="18" fill="#4aa8ff" font-weight="700" text-anchor="start"><tspan x="60" dy="0">The credential epoch</tspan></text><text x="60" y="160" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="60" dy="0">A fingerprint of generated passwords. Each snapshot is labelled with the one it was taken under.</tspan></text><rect x="36" y="204" width="364" height="246" rx="14" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="218" y="236" font-size="18" fill="#34d399" font-weight="700" text-anchor="middle"><tspan x="218" dy="0">Snapshot teardown</tspan></text><rect x="56" y="256" width="324" height="44" rx="10" fill="#161d24"/><text x="218" y="284" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="middle"><tspan x="218" dy="0">destroys only the server</tspan></text><rect x="56" y="320" width="324" height="44" rx="10" fill="#161d24"/><text x="218" y="348" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="middle"><tspan x="218" dy="0">passwords stay, so the fingerprint stays</tspan></text><path d="M218 302V317" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-g)"/><rect x="56" y="384" width="324" height="44" rx="10" fill="#161d24"/><text x="218" y="412" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="middle"><tspan x="218" dy="0">the snapshot matches and is restored</tspan></text><path d="M218 366V381" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-g)"/><rect x="420" y="204" width="364" height="246" rx="14" fill="none" stroke="#f5a524" stroke-width="2.5"/><text x="602" y="236" font-size="18" fill="#f5a524" font-weight="700" text-anchor="middle"><tspan x="602" dy="0">Rebuild teardown</tspan></text><rect x="440" y="256" width="324" height="44" rx="10" fill="#161d24"/><text x="602" y="284" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="middle"><tspan x="602" dy="0">destroys most passwords too</tspan></text><rect x="440" y="320" width="324" height="44" rx="10" fill="#161d24"/><text x="602" y="348" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="middle"><tspan x="602" dy="0">the next spin-up makes new ones</tspan></text><path d="M602 302V317" stroke="#f5a524" stroke-width="2.5" marker-end="url(#arrow-o)"/><rect x="440" y="384" width="324" height="44" rx="10" fill="#161d24"/><text x="602" y="412" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="middle"><tspan x="602" dy="0">older snapshots no longer match: refused</tspan></text><path d="M602 366V381" stroke="#f5a524" stroke-width="2.5" marker-end="url(#arrow-o)"/><rect x="36" y="474" width="748" height="98" rx="14" fill="none" stroke="#8291a0" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="504" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="56" dy="0">The refusal is the guard working</tspan></text><text x="56" y="527" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="56" dy="0">The old disk holds databases and accounts made with the old passwords. Restored, the stack</tspan><tspan x="56" dy="19.575">would boot and log in nowhere. The spin-up builds a fresh server and restores from R2 instead.</tspan></text></svg>
