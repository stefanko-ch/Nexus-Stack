<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-label="Snapshot spin-up decision: a usable snapshot is restored, a definite absence builds fresh from the R2 backup, and a failed lookup stops the run" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Snapshot spin-up decision: a usable snapshot is restored, a definite absence builds fresh from the R2 backup, and a failed lookup stops the run</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="600" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Cannot tell is not the same as there is none</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">A definite no falls back. An unknown stops.</tspan></text><rect x="100" y="104" width="620" height="46" rx="23" fill="#161d24" stroke="#8291a0" stroke-width="2"/><text x="410" y="133" font-size="15.5" fill="#f2f5f7" font-weight="600" text-anchor="middle"><tspan x="410" dy="0">Spin-up: is there a snapshot to restore?</tspan></text><path d="M154 152V184" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-g)"/><rect x="36" y="188" width="236" height="190" rx="14" fill="#161d24"/><rect x="36" y="188" width="236" height="8" rx="4" fill="#34d399"/><text x="56" y="230" font-size="20" fill="#34d399" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Yes</tspan></text><text x="56" y="262" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Restore the disk from</tspan><tspan x="56" dy="20.3">the snapshot.</tspan></text><text x="56" y="320" font-size="14.5" fill="#f2f5f7" font-weight="600" text-anchor="start"><tspan x="56" dy="0">The R2 restore is off:</tspan><tspan x="56" dy="21.025">the snapshot is newer.</tspan></text><path d="M410 152V184" stroke="#4aa8ff" stroke-width="2.5" marker-end="url(#arrow-b)"/><rect x="292" y="188" width="236" height="190" rx="14" fill="#161d24"/><rect x="292" y="188" width="236" height="8" rx="4" fill="#4aa8ff"/><text x="312" y="230" font-size="20" fill="#4aa8ff" font-weight="700" text-anchor="start"><tspan x="312" dy="0">Definitely not</tspan></text><text x="312" y="262" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="312" dy="0">No snapshot exists, or its</tspan><tspan x="312" dy="20.3">credential epoch differs.</tspan></text><text x="312" y="320" font-size="14.5" fill="#f2f5f7" font-weight="600" text-anchor="start"><tspan x="312" dy="0">Build a fresh server and</tspan><tspan x="312" dy="21.025">restore from the R2 backup.</tspan></text><path d="M666 152V184" stroke="#f5a524" stroke-width="2.5" marker-end="url(#arrow-o)"/><rect x="548" y="188" width="236" height="190" rx="14" fill="#161d24"/><rect x="548" y="188" width="236" height="8" rx="4" fill="#f5a524"/><text x="568" y="230" font-size="20" fill="#f5a524" font-weight="700" text-anchor="start"><tspan x="568" dy="0">Cannot tell</tspan></text><text x="568" y="262" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="568" dy="0">The snapshot lookup failed,</tspan><tspan x="568" dy="20.3">or the state is unreachable.</tspan></text><text x="568" y="320" font-size="14.5" fill="#f2f5f7" font-weight="600" text-anchor="start"><tspan x="568" dy="0">Stop. Nothing is built</tspan><tspan x="568" dy="21.025">until someone looks.</tspan></text><text x="36" y="422" font-size="17" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">The same rule picks the workflow pair</tspan></text><rect x="36" y="440" width="364" height="100" rx="12" fill="#161d24"/><rect x="36" y="440" width="6" height="100" rx="3" fill="#4aa8ff"/><text x="60" y="470" font-size="15.5" fill="#4aa8ff" font-weight="700" text-anchor="start"><tspan x="60" dy="0">No lifecycle_mode stored</tspan></text><text x="60" y="496" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="60" dy="0">A definite answer: the stack was never</tspan><tspan x="60" dy="20.3">switched. The rebuild pair is used.</tspan></text><rect x="420" y="440" width="364" height="100" rx="12" fill="#161d24"/><rect x="420" y="440" width="6" height="100" rx="3" fill="#f5a524"/><text x="444" y="470" font-size="15.5" fill="#f5a524" font-weight="700" text-anchor="start"><tspan x="444" dy="0">Database unreadable, or the value unknown</tspan></text><text x="444" y="496" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="444" dy="0">Cannot tell which pair is right.</tspan><tspan x="444" dy="20.3">Nothing is dispatched.</tspan></text><text x="410" y="574" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="410" dy="0">A guess after a failed lookup could put an older backup on top of a newer snapshot.</tspan></text></svg>
