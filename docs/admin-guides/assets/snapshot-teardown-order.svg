<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 706" role="img" aria-label="Snapshot teardown order: back up data to R2, power off, take the disk snapshot, record it in the Control Plane, destroy only the server, delete older snapshots" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Snapshot teardown order: back up data to R2, power off, take the disk snapshot, record it in the Control Plane, destroy only the server, delete older snapshots</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="706" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Snapshot teardown: the order is the safety</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">Each step sits where it does because of what the next one would destroy.</tspan></text><rect x="36" y="112" width="300" height="58" rx="12" fill="#161d24" stroke="#4aa8ff" stroke-width="2.5"/><text x="186" y="147" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Back up data to R2</tspan></text><text x="366" y="137" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="366" dy="0">First, because it needs the containers still running.</tspan></text><text x="366" y="158" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="366" dy="0">If it fails, the run stops and nothing is destroyed.</tspan></text><rect x="36" y="190" width="300" height="58" rx="12" fill="#161d24" stroke="#34d399" stroke-width="2.5"/><text x="186" y="225" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Power off the server</tspan></text><text x="366" y="215" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="366" dy="0">A disk is only consistent when nothing writes to it.</tspan></text><text x="366" y="236" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="366" dy="0">The run waits until the server reports off.</tspan></text><path d="M186 172V187" stroke="#8291a0" stroke-width="2.5" marker-end="url(#arrow-x)"/><rect x="36" y="268" width="300" height="58" rx="12" fill="#161d24" stroke="#34d399" stroke-width="2.5"/><text x="186" y="303" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Take the disk snapshot</tspan></text><text x="366" y="293" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="366" dy="0">Waits until the image is available, not just started.</tspan></text><text x="366" y="314" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="366" dy="0">It is labelled with the credential epoch.</tspan></text><path d="M186 250V265" stroke="#8291a0" stroke-width="2.5" marker-end="url(#arrow-x)"/><rect x="36" y="346" width="300" height="58" rx="12" fill="#161d24" stroke="#4aa8ff" stroke-width="2.5"/><text x="186" y="381" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Record it in the Control Plane</tspan></text><text x="366" y="371" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="366" dy="0">A copy for the Control Plane to show.</tspan></text><text x="366" y="392" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="366" dy="0">The labels at Hetzner stay the source of truth.</tspan></text><path d="M186 328V343" stroke="#8291a0" stroke-width="2.5" marker-end="url(#arrow-x)"/><rect x="36" y="424" width="300" height="58" rx="12" fill="#161d24" stroke="#f5a524" stroke-width="2.5"/><text x="186" y="459" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Destroy only the server</tspan></text><text x="366" y="449" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="366" dy="0">Only now. Passwords, tunnel and login rules stay.</tspan></text><text x="366" y="470" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="366" dy="0">That is what keeps the snapshot restorable.</tspan></text><path d="M186 406V421" stroke="#8291a0" stroke-width="2.5" marker-end="url(#arrow-x)"/><rect x="36" y="502" width="300" height="58" rx="12" fill="#161d24" stroke="#34d399" stroke-width="2.5"/><text x="186" y="537" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Delete older snapshots</tspan></text><text x="366" y="527" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="366" dy="0">Last, and only after a new snapshot exists.</tspan></text><text x="366" y="548" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="366" dy="0">Pruning first could leave nothing to restore from.</tspan></text><path d="M186 484V499" stroke="#8291a0" stroke-width="2.5" marker-end="url(#arrow-x)"/><rect x="36" y="584" width="748" height="92" rx="14" fill="none" stroke="#8291a0" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="612" font-size="16" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="56" dy="0">If the disk snapshot fails</tspan></text><text x="56" y="634" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="56" dy="0">The server is still destroyed: the R2 backup already ran, and the next spin-up builds fresh.</tspan><tspan x="56" dy="19.575">With strict_snapshot the run stops before the destroy and the server is kept.</tspan></text></svg>
