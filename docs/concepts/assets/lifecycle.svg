<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="Lifecycle: running, teardown, torn down, spin up, and the two modes rebuild and snapshot" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Lifecycle: running, teardown, torn down, spin up, and the two modes rebuild and snapshot</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="470" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">The server is disposable, the data is not</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">A teardown deletes the machine. A spin-up builds a new one.</tspan></text><rect x="60" y="130" width="250" height="120" rx="14" fill="#161d24" stroke="#34d399" stroke-width="3"/><text x="185" y="178" font-size="22" fill="#34d399" font-weight="700" text-anchor="middle"><tspan x="185" dy="0">Running</tspan></text><text x="185" y="206" font-size="15" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="185" dy="0">server up, stacks reachable,</tspan><tspan x="185" dy="19.5">billed by the hour</tspan></text><rect x="510" y="130" width="250" height="120" rx="14" fill="#161d24" stroke="#8291a0" stroke-width="3" stroke-dasharray="8 6"/><text x="635" y="178" font-size="22" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="635" dy="0">Torn down</tspan></text><text x="635" y="206" font-size="15" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="635" dy="0">no server, no cost;</tspan><tspan x="635" dy="19.5">what is kept: see below</tspan></text><path d="M318 165H502" stroke="#8291a0" stroke-width="3" marker-end="url(#arrow-x)"/><text x="410" y="152" font-size="16" fill="#f2f5f7" font-weight="600" text-anchor="middle"><tspan x="410" dy="0">Teardown</tspan></text><text x="410" y="186" font-size="13.5" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="410" dy="0">by hand or on a schedule</tspan></text><path d="M502 222H318" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-g)"/><text x="410" y="244" font-size="16" fill="#34d399" font-weight="600" text-anchor="middle"><tspan x="410" dy="0">Spin up</tspan></text><text x="36" y="312" font-size="17" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">What comes back depends on the mode you choose</tspan></text><rect x="36" y="330" width="364" height="104" rx="12" fill="#161d24"/><rect x="36" y="330" width="6" height="104" rx="3" fill="#4aa8ff"/><text x="60" y="362" font-size="18" fill="#4aa8ff" font-weight="700" text-anchor="start"><tspan x="60" dy="0">Rebuild</tspan></text><text x="60" y="388" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="60" dy="0">A fresh server. Data is restored from</tspan><tspan x="60" dy="18.85">backup for the stacks the backup covers.</tspan></text><rect x="420" y="330" width="364" height="104" rx="12" fill="#161d24"/><rect x="420" y="330" width="6" height="104" rx="3" fill="#34d399"/><text x="444" y="362" font-size="18" fill="#34d399" font-weight="700" text-anchor="start"><tspan x="444" dy="0">Snapshot</tspan></text><text x="444" y="388" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="444" dy="0">The whole disk is restored.</tspan><tspan x="444" dy="18.85">Every stack keeps its data.</tspan></text></svg>
