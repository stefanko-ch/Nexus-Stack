<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-label="Nexus Stack in one picture: you, the Control Plane, GitHub Actions and your server" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Nexus Stack in one picture: you, the Control Plane, GitHub Actions and your server</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="430" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Nexus Stack in one picture</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">You say what you want. GitHub builds it. Your server runs it.</tspan></text><circle cx="110" cy="180" r="44" fill="#161d24" stroke="#8291a0" stroke-width="3"/><g transform="translate(90.8 160.8) scale(1.6)" fill="none" stroke="#8291a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g><text x="110" y="256" font-size="19" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="110" dy="0">You</tspan></text><text x="110" y="280" font-size="15" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="110" dy="0">click in</tspan><tspan x="110" dy="19.5">the browser</tspan></text><circle cx="310" cy="180" r="44" fill="#161d24" stroke="#4aa8ff" stroke-width="3"/><g transform="translate(290.8 160.8) scale(1.6)" fill="none" stroke="#4aa8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16"/><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M8 4v4"/></g><text x="310" y="256" font-size="19" fill="#4aa8ff" font-weight="700" text-anchor="middle"><tspan x="310" dy="0">Control Plane</tspan></text><text x="310" y="280" font-size="15" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="310" dy="0">remembers</tspan><tspan x="310" dy="19.5">what you want</tspan></text><circle cx="510" cy="180" r="44" fill="#161d24" stroke="#f5a524" stroke-width="3"/><path transform="translate(490.8 160.8) scale(1.6)" fill="#f5a524" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/><text x="510" y="256" font-size="19" fill="#f5a524" font-weight="700" text-anchor="middle"><tspan x="510" dy="0">GitHub Actions</tspan></text><text x="510" y="280" font-size="15" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="510" dy="0">builds it,</tspan><tspan x="510" dy="19.5">every time</tspan></text><circle cx="710" cy="180" r="44" fill="#161d24" stroke="#34d399" stroke-width="3"/><g transform="translate(690.8 160.8) scale(1.6)" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M7 8l0 .01"/><path d="M7 16l0 .01"/></g><text x="710" y="256" font-size="19" fill="#34d399" font-weight="700" text-anchor="middle"><tspan x="710" dy="0">Your server</tspan></text><text x="710" y="280" font-size="15" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="710" dy="0">runs your</tspan><tspan x="710" dy="19.5">stacks</tspan></text><path d="M162 180H256" stroke="#4aa8ff" stroke-width="3" marker-end="url(#arrow-b)"/><text x="209.0" y="166" font-size="13" fill="#4aa8ff" font-weight="400" text-anchor="middle"><tspan x="209.0" dy="0">enable, spin up</tspan></text><path d="M362 180H456" stroke="#f5a524" stroke-width="3" marker-end="url(#arrow-o)"/><text x="409.0" y="166" font-size="13" fill="#f5a524" font-weight="400" text-anchor="middle"><tspan x="409.0" dy="0">starts a workflow</tspan></text><path d="M562 180H656" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-g)"/><text x="609.0" y="166" font-size="13" fill="#34d399" font-weight="400" text-anchor="middle"><tspan x="609.0" dy="0">creates, deploys</tspan></text><path d="M110 308V368H170M650 368H710V308" stroke="#8291a0" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow-x)"/><rect x="170" y="344" width="480" height="48" rx="24" fill="#161d24" stroke="#8291a0" stroke-width="1.5"/><g transform="translate(192.0 356.0) scale(1.0)" fill="none" stroke="#f2f5f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></g><text x="232" y="374" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="232" dy="0">You use your stacks through Cloudflare, after an email login</tspan></text><text x="410" y="414" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="410" dy="0">The server has no open ports.</tspan></text></svg>
