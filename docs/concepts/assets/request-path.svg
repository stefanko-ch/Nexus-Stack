<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="Request path: browser, Cloudflare email login, a tunnel opened from inside the server, your stack; and one optional port that you open yourself" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Request path: browser, Cloudflare email login, a tunnel opened from inside the server, your stack; and one optional port that you open yourself</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="470" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">How a request reaches a stack</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">The server never listens on the internet. It calls out to Cloudflare instead.</tspan></text><rect x="520" y="110" width="270" height="326" rx="16" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="655" y="140" font-size="17" fill="#34d399" font-weight="700" text-anchor="middle"><tspan x="655" dy="0">Your server</tspan></text><text x="655" y="162" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="655" dy="0">0 open ports by default</tspan></text><circle cx="80" cy="230" r="36" fill="#161d24" stroke="#8291a0" stroke-width="3"/><g transform="translate(63.2 213.2) scale(1.4)" fill="none" stroke="#8291a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></g><text x="80" y="292" font-size="17" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="80" dy="0">You</tspan></text><text x="80" y="314" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="80" dy="0">in the browser</tspan></text><rect x="180" y="186" width="210" height="88" rx="14" fill="#161d24" stroke="#4aa8ff" stroke-width="3"/><text x="285" y="222" font-size="19" fill="#4aa8ff" font-weight="700" text-anchor="middle"><tspan x="285" dy="0">Cloudflare</tspan></text><text x="285" y="248" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="285" dy="0">asks for an email code</tspan></text><rect x="570" y="194" width="170" height="72" rx="12" fill="#161d24" stroke="#34d399" stroke-width="3"/><text x="655" y="228" font-size="18" fill="#f2f5f7" font-weight="700" text-anchor="middle"><tspan x="655" dy="0">Your stack</tspan></text><text x="655" y="250" font-size="14" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="655" dy="0">Kestra, Grafana, …</tspan></text><path d="M122 230H172" stroke="#4aa8ff" stroke-width="3" marker-end="url(#arrow-b)"/><path d="M562 230H398" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-g)"/><text x="456" y="198" font-size="13" fill="#34d399" font-weight="400" text-anchor="middle"><tspan x="456" dy="0">tunnel, opened</tspan><tspan x="456" dy="16.900000000000002">from the inside</tspan></text><g transform="translate(63.2 361.2) scale(1.4)" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6m-8 0a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></g><text x="126" y="374" font-size="14.5" fill="#f2f5f7" font-weight="500" text-anchor="start"><tspan x="126" dy="0">A database or</tspan><tspan x="126" dy="20.009999999999998">Kafka client</tspan></text><path d="M250 378H562" stroke="#f5a524" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-o)"/><rect x="570" y="352" width="170" height="52" rx="10" fill="#161d24" stroke="#f5a524" stroke-width="2.5" stroke-dasharray="7 6"/><text x="655" y="384" font-size="14.5" fill="#f5a524" font-weight="600" text-anchor="middle"><tspan x="655" dy="0">one port you opened</tspan></text><text x="382" y="364" font-size="12.5" fill="#f5a524" font-weight="400" text-anchor="middle"><tspan x="382" dy="0">only after you open it on the Firewall page</tspan></text><text x="382" y="406" font-size="12.5" fill="#a9b4bf" font-weight="400" text-anchor="middle"><tspan x="382" dy="0">closed again at every teardown</tspan></text></svg>
