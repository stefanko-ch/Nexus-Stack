<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="Three planes: the control plane at Cloudflare, the execution plane in GitHub Actions, the data plane at Hetzner; state that outlives the server sits in R2 and in a disk snapshot" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Three planes: the control plane at Cloudflare, the execution plane in GitHub Actions, the data plane at Hetzner; state that outlives the server sits in R2 and in a disk snapshot</title><defs><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa8ff"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8291a0"/></marker></defs><rect width="820" height="470" rx="18" fill="#0e1318"/><text x="36" y="50" font-size="26" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Three planes that never merge</tspan></text><text x="36" y="78" font-size="16" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="36" dy="0">Nothing you click touches the server directly.</tspan></text><rect x="36" y="112" width="236" height="204" rx="14" fill="#161d24"/><rect x="36" y="112" width="236" height="8" rx="4" fill="#4aa8ff"/><text x="56" y="156" font-size="20" fill="#4aa8ff" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Control plane</tspan></text><text x="56" y="180" font-size="14.5" fill="#f2f5f7" font-weight="600" text-anchor="start"><tspan x="56" dy="0">Cloudflare</tspan></text><text x="56" y="216" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="56" dy="0">The Control Plane website.</tspan><tspan x="56" dy="21.025">Stores which stacks are on,</tspan><tspan x="56" dy="21.025">your settings and firewall rules.</tspan></text><rect x="292" y="112" width="236" height="204" rx="14" fill="#161d24"/><rect x="292" y="112" width="236" height="8" rx="4" fill="#f5a524"/><text x="312" y="156" font-size="20" fill="#f5a524" font-weight="700" text-anchor="start"><tspan x="312" dy="0">Execution plane</tspan></text><text x="312" y="180" font-size="14.5" fill="#f2f5f7" font-weight="600" text-anchor="start"><tspan x="312" dy="0">GitHub Actions</tspan></text><text x="312" y="216" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="312" dy="0">Runs every change.</tspan><tspan x="312" dy="21.025">OpenTofu creates the server,</tspan><tspan x="312" dy="21.025">nexus_deploy starts the stacks.</tspan></text><rect x="548" y="112" width="236" height="204" rx="14" fill="#161d24"/><rect x="548" y="112" width="236" height="8" rx="4" fill="#34d399"/><text x="568" y="156" font-size="20" fill="#34d399" font-weight="700" text-anchor="start"><tspan x="568" dy="0">Data plane</tspan></text><text x="568" y="180" font-size="14.5" fill="#f2f5f7" font-weight="600" text-anchor="start"><tspan x="568" dy="0">Hetzner Cloud</tspan></text><text x="568" y="216" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="568" dy="0">One server with Docker.</tspan><tspan x="568" dy="21.025">Your stacks and your data</tspan><tspan x="568" dy="21.025">live here while it runs.</tspan></text><path d="M272 214H288" stroke="#f5a524" stroke-width="3" marker-end="url(#arrow-o)"/><path d="M528 214H544" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-g)"/><rect x="36" y="346" width="748" height="92" rx="14" fill="none" stroke="#8291a0" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="380" font-size="17" fill="#f2f5f7" font-weight="700" text-anchor="start"><tspan x="56" dy="0">What outlives the server</tspan></text><text x="56" y="408" font-size="14.5" fill="#a9b4bf" font-weight="400" text-anchor="start"><tspan x="56" dy="0">OpenTofu state and data backups in Cloudflare R2 · optional disk snapshot at Hetzner</tspan></text></svg>
