# =============================================================================
# Apache Airflow - DAG-based workflow orchestration
# https://airflow.${DOMAIN}
# =============================================================================
# Airflow 3 with the LocalExecutor: tasks run as subprocesses of the scheduler,
# so there is no Celery, no Redis and no worker container. The Airflow 3
# component split is kept as upstream ships it:
#
#   airflow-init           one-shot: schema migration + admin user, then exits
#   airflow (api-server)   UI, REST API and the Execution API tasks call back to
#   airflow-scheduler      schedules DAG runs and executes their tasks
#   airflow-dag-processor  parses the DAG files into the metadata database
#   airflow-triggerer      runs deferred (async) operators
#   airflow-db             dedicated PostgreSQL, internal network only
#
# Login is Airflow's own (the FAB auth manager) on top of Cloudflare Access.
# Username = ADMIN_USERNAME, password generated by OpenTofu, both in Infisical
# under `airflow`.
#
# DAGs live in the named volume `airflow_dags`, mounted at /opt/airflow/dags in
# every component. Nothing syncs DAGs into it yet.
#
# Docs: https://airflow.apache.org/docs/apache-airflow/3.3.1/
# =============================================================================

x-airflow-common: &airflow-common
  image: ${IMAGE_AIRFLOW:-apache/airflow:3.3.1}
  restart: unless-stopped
  # No `env_file`. Every value below is interpolated from .env by Compose,
  # so a container receives only the Airflow settings it needs. With the
  # LocalExecutor, task processes inherit the scheduler's environment, and
  # an `env_file` here would hand every DAG the admin password.
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow 3's default is the SimpleAuthManager, which upstream documents
    # as intended for development and testing. The FAB auth manager ships in this
    # image (apache-airflow-providers-fab 3.8.0, verified with `pip list`) and
    # is what upstream's own docker-compose.yaml for 3.3.1 selects.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nexus-airflow:${AIRFLOW_DB_PASSWORD:?must be set in .env (rendered by service_env._render_airflow)}@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?must be set in .env (rendered by service_env._render_airflow)}
    # Every component must sign and verify with the same values. Left unset,
    # each container generates its own. Measured with the scheduler given a
    # different JWT secret than the api-server: the stack reports healthy,
    # and the first task fails with `403 Invalid auth token` from the
    # Execution API.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?must be set in .env (rendered by service_env._render_airflow)}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?must be set in .env (rendered by service_env._render_airflow)}
    # The public URL, used for links the UI and FAB login generate.
    AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL:?must be set in .env (rendered by service_env._render_airflow)}
    # ⚠️ Load-bearing. The default is `{base_url}/execution/`, which with the
    # base URL above is the public hostname — behind Cloudflare Access, where
    # a task has no session and gets the login page instead of the API. Tasks
    # call the api-server over the internal network instead.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Upper bound on concurrently running task processes. With the
    # LocalExecutor each is a subprocess of the scheduler, so this is what
    # the scheduler's memory limit has to accommodate.
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - airflow_dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # One-shot. `restart: unless-stopped` from the anchor would restart a
    # container that exited 0 by design.
    restart: "no"
    environment:
      <<: *airflow-common-env
      # The admin identity reaches this container only.
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?must be set in .env (rendered by service_env._render_airflow)}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?must be set in .env (rendered by service_env._render_airflow)}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:?must be set in .env (rendered by service_env._render_airflow)}
    # Not the image's `_AIRFLOW_DB_MIGRATE` / `_AIRFLOW_WWW_USER_CREATE`
    # switches: its entrypoint runs both as `airflow db migrate || true` and
    # `airflow users create ... || true`, so a failed migration still exits 0
    # and every component then starts against a broken schema. Here each step
    # fails the container, and `service_completed_successfully` below keeps
    # the rest of the stack from starting.
    #
    # `users create` refuses an existing user, so on every start after the
    # first the password is reset instead. That keeps Airflow's login equal to
    # the value in Infisical whenever the database outlives a credential
    # rotation.
    #
    # The password is an argument to the airflow CLI, visible in the process
    # list of this container for the second the command runs. `users create
    # --help` offers only `--password` or `--use-random-password`, and a
    # random password would never match the one in Infisical.
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        : "$${AIRFLOW_ADMIN_USERNAME:?}" "$${AIRFLOW_ADMIN_PASSWORD:?}" "$${AIRFLOW_ADMIN_EMAIL:?}"
        airflow db migrate
        if airflow users list --output plain | awk 'NR>1 {print $$2}' | grep -qxF -- "$$AIRFLOW_ADMIN_USERNAME"; then
          airflow users reset-password --username "$$AIRFLOW_ADMIN_USERNAME" --password "$$AIRFLOW_ADMIN_PASSWORD"
          echo "Airflow admin user exists, password synced from Infisical"
        else
          airflow users create --role Admin \
            --username "$$AIRFLOW_ADMIN_USERNAME" --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --email "$$AIRFLOW_ADMIN_EMAIL" --firstname Airflow --lastname Admin
          echo "Airflow admin user created"
        fi
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - airflow-internal

  airflow-api-server:
    <<: *airflow-common
    # Named after the services.yaml key: compose_runner verifies the stack
    # started by grepping `docker ps` for exactly `airflow`.
    container_name: airflow
    # --proxy-headers: cloudflared terminates TLS and forwards
    # X-Forwarded-Proto, so the api-server knows the browser is on https.
    # Measured through a login POST with the tunnel's headers: with the flag,
    # the `_token` auth cookie is set `Secure`; without it the login still
    # works but the cookie loses `Secure`.
    command: ["api-server", "--proxy-headers"]
    environment:
      <<: *airflow-common-env
      # Uvicorn only trusts forwarded headers from 127.0.0.1 by default, and
      # requests reach the container through Docker's port publishing, not
      # from loopback inside it. Measured with the default: the headers are
      # ignored and the cookie loses `Secure` exactly as without the flag.
      # The published port is bound to 127.0.0.1 on the host, so the other
      # possible senders are containers on app-network, which can at most
      # mislabel the scheme or client IP of their own requests.
      FORWARDED_ALLOW_IPS: "*"
      # Uvicorn workers. Upstream's default of 4 costs memory this single
      # user-facing UI does not need.
      AIRFLOW__API__WORKERS: "2"
    ports:
      # Bound to loopback: cloudflared reaches it via localhost either way.
      - "127.0.0.1:8104:8080"
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - app-network
      - airflow-internal

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: ["scheduler"]
    deploy:
      resources:
        limits:
          # Task processes run inside this container (LocalExecutor).
          memory: 3g
    healthcheck:
      # The scheduler's own health server (ENABLE_HEALTH_CHECK above), port
      # 8974 inside the container. Cheaper than `airflow jobs check`, which
      # starts a Python interpreter on every probe.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      # app-network because tasks run here and are expected to reach the
      # other stacks (databases, object storage, APIs).
      - app-network
      - airflow-internal

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: ["dag-processor"]
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-internal

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: ["triggerer"]
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      # Deferred operators poll external systems from here.
      - app-network
      - airflow-internal

  airflow-db:
    image: ${IMAGE_AIRFLOW_DB:-postgres:17-alpine}
    container_name: airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus-airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?must be set in .env (rendered by service_env._render_airflow)}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus-airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      # Internal only: the Airflow components are its only clients.
      - airflow-internal

volumes:
  airflow_dags:
  airflow_logs:
  airflow_db_data:

networks:
  app-network:
    external: true
  airflow-internal:
    driver: bridge
