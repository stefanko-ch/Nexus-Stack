# =============================================================================
# apicurio-proxy — one hostname for the UI and the registry API
# =============================================================================
# Apicurio 3.x splits into two images, and the UI is a single-page app: it
# reads REGISTRY_API_URL at startup, writes it into config.js, and the
# BROWSER then calls that URL. So the API has to be reachable from outside.
#
# The two alternatives are worse. An in-cluster address fails in every
# browser. A second hostname means a second Access application and
# cross-origin calls, which then need CORS configured on the registry.
#
# Serving both under one hostname makes them same-origin, so neither applies.
# =============================================================================

server {
    listen 80;

    # Everything the registry owns. `/apis` is the API root; `/health` and
    # `/metrics` are Quarkus endpoints that belong to the same service and
    # would otherwise be shadowed by the UI's catch-all below.
    location /apis/ {
        proxy_pass http://apicurio:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An OpenAPI document or a large Avro schema is not a small body, and
        # nginx's 1m default would reject it with a 413 the UI reports as a
        # generic failure.
        client_max_body_size 16m;
    }

    location = /health/ready {
        proxy_pass http://apicurio:8080/health/ready;
    }

    # The UI, and everything it loads. Last, so the API paths above win.
    location / {
        proxy_pass http://apicurio-ui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
