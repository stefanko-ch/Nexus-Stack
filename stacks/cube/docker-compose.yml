# =============================================================================
# Cube - Semantic layer between the warehouse and the BI tools
# https://cube.${DOMAIN}
# =============================================================================
# The layer this catalogue was missing. Superset, Metabase and Evidence each
# define their own metrics today, so "revenue" is written three times and
# drifts three ways. Cube holds one definition and serves it to all of them
# over SQL, REST and GraphQL.
#
# Two containers:
#
#   cube        the SQL, REST and GraphQL APIs — token-authenticated
#   cube-store  Cube's own storage layer for cache, queue and pre-aggregations
#
# cube-store is NOT optional, and that is upstream's word rather than a guess:
# "While Cube can operate with in-memory cache and queue storage, there're
# multiple parts of Cube which require Cube Store in production mode."
#
# DATA SOURCE: the shared `postgres` stack. Cube reads whatever tables are
# there; it creates none of its own. A fresh stack therefore starts with no
# data model, which is the intended starting point: a model describes tables
# that exist, and a fresh warehouse has none. To generate a first model by
# clicking, run Cube on a laptop in development mode — stacks/cube/model/
# README.md has the command — and commit what it produces.
#
# THE DATA MODEL LIVES IN THIS REPOSITORY, under stacks/cube/model/, and is
# mounted read-only. stack-sync copies it to the server on every spin-up, so
# there is nothing to persist and nothing to lose: the semantic layer is
# reviewed and versioned like the rest of the deployment.
#
# NO PLAYGROUND. Cube serves its UI only in development mode, which upstream
# describes as an authentication bypass and tells you never to run in
# production. This stack runs with it off; see docs/stacks/cube.md for how to
# query the API and how to author a model.
# =============================================================================

services:
  cube:
    image: ${IMAGE_CUBE:-cubejs/cube:v1.7.42}
    container_name: cube
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host 4001 → container 4000. Cube's own default is 4000 and stays that
      # way inside the container; the host side is shifted because litellm
      # already binds 4000.
      - "4001:4000"
    environment:
      # Explicitly off, and stated rather than left to the image default.
      #
      # Development mode is what serves Cube's Playground UI, and upstream
      # says plainly what it costs: "Development mode is an authentication
      # bypass ... switches off JWT verification on the REST (JSON) and
      # GraphQL APIs", followed by "Use it only on a local development
      # machine, never in production."
      #
      # So this stack has no Playground. It is an API that BI tools query
      # with a token signed by CUBE_API_SECRET, and the data model is a set
      # of files in this directory rather than something clicked together.
      # The image already ships NODE_ENV=production; writing the variable
      # anyway means an upstream default flip cannot quietly turn the bypass
      # on, and a test pins it.
      CUBEJS_DEV_MODE: "false"
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: postgres
      CUBEJS_DB_USER: nexus-postgres
      CUBEJS_DB_PASS: ${POSTGRES_PASSWORD}
      # Signs and verifies the JWTs of the APIs. Generated by OpenTofu and
      # pushed to Infisical, so a BI tool connecting from outside can be given
      # a token without anyone inventing a secret by hand.
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}
      CUBEJS_CUBESTORE_HOST: cube-store
      CUBEJS_CUBESTORE_PORT: "3030"
      # Cube writes its telemetry to the console on every start otherwise.
      CUBEJS_TELEMETRY: "false"
    volumes:
      # The data model, from this directory, read-only.
      #
      # Cube reads its model from /cube/conf/model, and stack-sync copies
      # stacks/cube/ to the server on every spin-up — so the semantic layer
      # is version-controlled in the repository that deploys it, reviewed
      # like any other change, and identical on every stack built from this
      # fork. Nothing to back up, and nothing lost in a teardown.
      #
      # Read-only because the alternative is a model that drifts on one
      # server and exists nowhere else. Ad-hoc experiments belong in a
      # branch, not in a container's filesystem.
      - ./model:/cube/conf/model:ro
    mem_limit: 1g
    depends_on:
      cube-store:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      # Cube's own liveness endpoint, probed with node.
      #
      # NOT curl: the image has neither curl nor wget — measured, after the
      # first draft used curl and left the container permanently `unhealthy`
      # with `/bin/sh: 1: curl: not found` in every probe. It ships node,
      # which is what it is written in.
      #
      # `livez` rather than `readyz`: the latter also checks the data source,
      # which would mark this container unhealthy whenever Postgres is down —
      # true, but it makes an unrelated outage look like a broken Cube.
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:4000/livez',
          r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error',
          () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cube-store:
    # Pinned to the same version as `cube`: upstream ships them in lockstep and
    # a version skew here is a protocol mismatch, not a feature difference.
    #
    # amd64 ONLY, unlike every other image in this catalogue. The servers are
    # x86 `cx43` since 2026-05, so this meets the requirement in CLAUDE.md —
    # but a contributor on Apple Silicon cannot run this container without
    # emulation, and that is worth knowing before reaching for it.
    #
    # It also needs AVX. Upstream publishes `-non-avx` tags for CPUs without
    # it; Hetzner's Intel instances have AVX, and a machine without it fails
    # at startup rather than silently degrading.
    image: ${IMAGE_CUBE_STORE:-cubejs/cubestore:v1.7.42}
    container_name: cube-store
    restart: unless-stopped
    environment:
      CUBESTORE_SERVER_NAME: cube-store:3030
      # Declared, not inherited. Cube Store's default data directory is
      # /cube/.cubestore — measured — so the volume below was mounted at a
      # path it never wrote to, and every container recreate would have
      # thrown away the cache and the metastore while looking fine.
      CUBESTORE_DATA_DIR: /cube/data
    volumes:
      - cube-store-data:/cube/data
    mem_limit: 1g
    networks:
      - app-network

volumes:
  # Cache, queue state and materialised pre-aggregations. Rebuildable by
  # definition: everything in here is derived from the warehouse.
  cube-store-data:

networks:
  app-network:
    external: true
