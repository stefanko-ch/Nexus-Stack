# =============================================================================
# Evidence - SQL + markdown BI for analytics engineers
# =============================================================================
# Evidence is a "BI as code" framework: write SQL queries inside
# .md files and the framework renders charts, tables, and value
# components inline. The project directory is plain markdown +
# YAML — version it in Git, edit with your normal tools.
#
# This stack ships the `devenv` runtime — the container watches the
# mounted project directory and re-renders pages on save. For a
# static production export run:
#     docker exec evidence npm run sources && docker exec evidence npm run build
# and serve the `build/` output from any of the file-store stacks.
#
# The stack brings its own Postgres (`evidence-db`) rather than pointing
# at the shared `postgres` stack. That stack is not `core`, so it is off
# unless the operator enables it — and Evidence's entrypoint runs
# `npm run sources` before the dev server, treating an unreachable source
# as fatal. Pointing at it produced `getaddrinfo EAI_AGAIN postgres`,
# `ExitCode=1`, and a restart loop on any stack that enabled Evidence
# alone. A dedicated database also follows the CLAUDE.md rule that each
# stack owns its resources, and it seeds sample rows so the bundled page
# renders on a fresh stack.
#
# Data sources are configured per-project in `project/sources/`.
# Write the connection literally: Evidence reads connection.yaml as
# YAML and does NOT expand ${VAR} in it (#725 — this header claimed
# the opposite, and the shipped source was written to that claim).
# Credentials travel separately, as
# `EVIDENCE_SOURCE__<source>__<field>` in the `environment:` block,
# which Evidence merges over the file — so an Infisical-managed
# Postgres / ClickHouse / Trino password still never enters the repo.
#
# Access: https://evidence.YOUR_DOMAIN  (behind Cloudflare Access
# unless you flip `public: true` in services.yaml).
# =============================================================================

services:
  evidence:
    # devenv:latest per CLAUDE.md exception for non-critical
    # standalone tools (Evidence is a presentation layer with no
    # persistent state beyond cache). The devenv image is the
    # supported dev-runtime entrypoint; Evidence does not publish
    # versioned devenv tags.
    image: ${IMAGE_EVIDENCE:-evidencedev/devenv:latest}
    container_name: evidence
    # env_file picks up the renderer-populated EVIDENCE_DB_PASSWORD /
    # EVIDENCE_BASE_URL and any operator-added variables in
    # stacks/evidence/.env.
    #
    # Those variables do NOT reach sources/<name>/connection.yaml by
    # interpolation — Evidence reads that file literally, which is the
    # defect this stack shipped with (#725). A second data source needs
    # its credential passed as EVIDENCE_SOURCE__<source>__<field> in the
    # `environment:` block below, which Evidence merges over the file.
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      evidence-db:
        condition: service_healthy
    ports:
      # Host 3007 → container 3000 (Evidence's SvelteKit dev port).
      # 3000-3006 are already taken by metabase/uptime-kuma/wetty/
      # hoppscotch/dagster/wikijs/big-agi.
      - "3007:3000"
    environment:
      # Belt and braces for the bind address. The image entrypoint
      # already appends `--host 0.0.0.0` to `npm run dev`, which is why
      # the same flag was removed from package.json's `dev` script --
      # passing it twice made vite reject the duplicate and exit, taking
      # the container with it through the entrypoint's `&&` chain.
      HOST: 0.0.0.0
      PORT: "3000"
      # EVIDENCE_BASE_URL (used by Evidence for absolute links + OG tags)
      # is provided by env_file above — no explicit entry needed.
      # Only the password travels through the environment. The rest of
      # the connection lives literally in
      # sources/evidence_db/connection.yaml, because Evidence does not
      # interpolate ${VAR} inside that file -- the previous POSTGRES_HOST
      # and friends were read verbatim by the driver and never resolved.
      #
      # `EVIDENCE_SOURCE__<source>__<field>` is the documented override:
      # Evidence merges it over connection.yaml, so the secret stays out
      # of the repository while the rest stays readable.
      EVIDENCE_SOURCE__evidence_db__password: ${EVIDENCE_DB_PASSWORD}
    volumes:
      # The sample project shipped under stacks/evidence/project/ is
      # synced to /opt/docker-server/stacks/evidence/project/ by the
      # deploy pipeline and mounted read-write so users can edit it
      # in-place via code-server / a Git checkout.
      - ./project:/evidence-workspace
    healthcheck:
      # `/@vite/client`, not `/`. The root page runs the bundled source
      # query, and a query returning zero rows currently crashes the
      # server (#725 defect 7) -- so probing `/` marks the container
      # unhealthy on an empty database. The seeded sample table means the
      # default project no longer reaches that state, but a user who
      # replaces the query still can, and the probe should not depend on
      # what the page happens to select.
      #
      # `/@vite/client` is served by vite's dev middleware and renders
      # no Evidence page, so it answers whenever the dev server is up
      # and never executes a query. The wget invocation is unchanged,
      # so no new assumption about the image's tooling.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/@vite/client >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - app-network
      - evidence-internal

  evidence-db:
    image: ${IMAGE_EVIDENCE_DB:-postgres:18-alpine}
    container_name: evidence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus-evidence
      POSTGRES_PASSWORD: ${EVIDENCE_DB_PASSWORD}
      POSTGRES_DB: evidence
      # No explicit PGDATA, and the mount is one level up from the
      # pre-18 location — the layout docker-library/postgres recommends
      # for 18+. Setting PGDATA to a subdirectory of the old mount also
      # keeps the data inside the volume, but silences the entrypoint's
      # legacy-cluster check, which runs ONLY when PGDATA is its default.
      # The server would then start an empty cluster without a word.
      # Loud beats quiet, so the mount moves instead.
    volumes:
      - evidence-db-data:/var/lib/postgresql
      # Seed data for the bundled page. `docker-entrypoint-initdb.d` runs
      # exactly once, on an empty data directory, so operator edits to the
      # tables survive every later restart.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - evidence-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus-evidence -d evidence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evidence-db-data:

networks:
  app-network:
    external: true
  evidence-internal:
    driver: bridge
