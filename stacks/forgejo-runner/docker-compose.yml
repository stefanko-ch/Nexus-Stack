# =============================================================================
# Forgejo Runner - Actions CI for the Forgejo stack
# =============================================================================
# Executes Forgejo Actions jobs. Optional: the Forgejo stack is core and
# always runs, but CI is only useful if somebody writes workflows — and
# it is the part that carries the privileged container, so it should
# not be present on servers that never use it.
#
# Requires the `forgejo` stack, which is core and therefore always
# there. The pairing is one-directional: enable this and it works.
#
# No web UI. Runners appear in Forgejo under
# Site Administration -> Actions -> Runners.
#
#   forgejo-runner  polls Forgejo for jobs and drives the daemon below
#   forgejo-dind    the Docker daemon those jobs actually run in
#
# SECURITY — read before enabling this on a shared stack:
# Anyone who can push to a repository can execute code here. That is
# not a Forgejo quirk; it is what self-hosted CI is. For a class stack
# it means every student with commit rights holds a code-execution
# primitive on this server.
#
# What bounds the blast radius:
#   1. forgejo-dind listens on a unix socket only, in a volume shared
#      with the runner and nothing else. An earlier revision listened on
#      tcp://0.0.0.0:2375, and a job container could drive that daemon
#      through its own gateway — measured: `GET /version` -> 200 from
#      inside a job (#679). A socket that is not in the job's filesystem
#      cannot be reached from it.
#   2. forgejo-dind is not on app-network, where the other stacks live.
#      Jobs cannot open connections to app-network container addresses
#      (measured). They CAN reach ports the host publishes on 0.0.0.0,
#      through any host address — see docs/stacks/forgejo-runner.md and
#      #742.
#   3. runner-config.yml leaves `container.docker_host: "-"` and
#      `valid_volumes: []`, so the runner does not hand a job container
#      a Docker socket and a workflow may not name host paths.
#
# HOW A JOB REACHES THE FORGE (#679):
# The runner is registered with http://forgejo:3000 and passes that
# address to every job, which clones from it. A job container lives on a
# network that forgejo-dind creates, where the name `forgejo` does not
# exist — measured on the first Conductor deploy: `Could not resolve
# host: forgejo`. So:
#   - forgejo-ci has a fixed subnet, and forgejo-git-proxy a fixed
#     address on it;
#   - runner-config.yml adds `--add-host=forgejo:<that address>` to every
#     job container;
#   - forgejo-git-proxy forwards port 3000 to the real forge over
#     app-network.
# The address the runner registered with does not change, so an
# existing .runner stays valid. Job traffic leaves forgejo-dind through
# its interface on forgejo-ci, which is why these fixed addresses are
# reachable from a job at all.
#
# NOT mitigated, and the reason this stack is separable in the first
# place: forgejo-dind runs `privileged: true` with dockerd as root.
#
# An earlier revision used `dind-rootless`, so that an escape would
# land as an unprivileged user inside the daemon container. That does
# not work on this platform and the claim has been removed rather than
# left standing: Ubuntu sets `kernel.apparmor_restrict_unprivileged_userns=1`
# from 23.10 onward, RootlessKit needs exactly that capability, and it
# dies with `fork/exec /proc/self/exe: operation not permitted` even
# inside a privileged container. The two ways to make it run — clearing
# the sysctl host-wide, or shipping an AppArmor profile for a binary
# inside an image — both weaken the host to harden one container.
#
# So leaving this stack disabled is the only way to not have a
# root-privileged Docker daemon on the box.
#
# The addresses 10.213.0.10 and .11 appear in runner-config.yml too, and
# tests/unit/test_stack_conventions.py keeps the two files in step.
# =============================================================================

services:
  # The Docker daemon that Actions jobs run in. Reachable only by the
  # runner, through the socket in forgejo-dind-socket.
  forgejo-dind:
    image: ${IMAGE_FORGEJO_DIND:-docker:29.7.2-dind}
    container_name: forgejo-dind
    restart: unless-stopped
    privileged: true
    environment:
      # No TLS material: there is no TCP listener to protect.
      DOCKER_TLS_CERTDIR: ""
    # `dockerd` spelled out, not only flags. Given flags alone, the
    # image's entrypoint prepends its default hosts — a unix socket AND
    # tcp://0.0.0.0:2375 — and the TCP listener is exactly what a job
    # could reach. With `dockerd` first it passes the arguments through
    # unchanged.
    #
    # `--group=1001` makes the socket group-owned by the runner's gid,
    # mode 0660, so the runner (1001:1001) can use it without running as
    # root.
    command: ["dockerd", "--host=unix:///run/dind/docker.sock", "--group=1001"]
    # This is the container that runs whatever a student pushed. Without
    # a ceiling one job can starve the other services on the box —
    # `runner.capacity: 2` bounds how many jobs run, not what each may
    # consume. Job containers are children of this daemon, so the limit
    # applies to their aggregate.
    #
    # `mem_limit`, not `deploy.resources.limits`, and the reason is
    # uncertainty rather than a flat claim about either key.
    # `deploy.resources` began as a Swarm-only setting applied under
    # `--compatibility`; some Compose v2 releases honour it directly.
    # Docker here comes from an unpinned get.docker.com, so the Compose
    # version on a given server is not known in advance — which is
    # precisely why the ambiguous key is the wrong one for the stack
    # that runs untrusted code. `mem_limit` binds on every version.
    #
    # Disk is NOT bounded by this. The layer cache has no quota; if CI
    # fills the disk it takes the host with it.
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - forgejo-dind-data:/var/lib/docker
      - forgejo-dind-socket:/run/dind
    networks:
      # The network job traffic leaves through. Its address is not
      # fixed; nothing connects to it.
      - forgejo-ci
    healthcheck:
      test: ["CMD-SHELL", "docker -H unix:///run/dind/docker.sock info >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The forge, as seen from a job: port 3000 on a fixed address that
  # runner-config.yml maps the name `forgejo` to. A TCP forward and
  # nothing more, so clone, API and artifact uploads all pass unchanged.
  forgejo-git-proxy:
    image: ${IMAGE_FORGEJO_GIT_PROXY:-nginx:1.30.4-alpine}
    container_name: forgejo-git-proxy
    restart: unless-stopped
    volumes:
      - ./git-proxy.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      # app-network to reach the forge in the `forgejo` stack.
      app-network: {}
      forgejo-ci:
        ipv4_address: 10.213.0.10

  forgejo-runner:
    image: ${IMAGE_FORGEJO_RUNNER:-data.forgejo.org/forgejo/runner:13.0.0}
    container_name: forgejo-runner
    restart: unless-stopped
    user: "1001:1001"
    working_dir: /data
    environment:
      DOCKER_HOST: unix:///run/dind/docker.sock
      # Named explicitly rather than pulled in with an `env_file:`. The
      # runner is the only container that needs these two, and nothing
      # else in this stack should see the registration secret.
      FORGEJO_INSTANCE_URL: ${FORGEJO_INSTANCE_URL}
      FORGEJO_RUNNER_SECRET: ${FORGEJO_RUNNER_SECRET}
    # Offline registration: OpenTofu generates one 40-hex secret and both
    # sides receive it, so no human ever pastes a single-use token out of
    # the web UI. `create-runner-file` is deterministic — same secret in,
    # same .runner out — which is what makes re-running this safe.
    #
    # The server-side half (`forgejo forgejo-cli actions register`) runs
    # in the deploy pipeline, possibly AFTER this container first
    # starts. That is fine: the daemon fails to authenticate, the
    # restart policy brings it back, and it succeeds once the server
    # knows the secret.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Only on first boot. `create-runner-file` is deterministic —
        # same secret in, same .runner out — so re-running it changes
        # nothing, and skipping it keeps the secret out of argv on
        # every restart after the first.
        #
        # It cannot be kept out of argv entirely: `create-runner-file`
        # accepts the secret only as `--secret <value>`, with no stdin
        # or file variant. The server-side half has both and uses them.
        if [ ! -f /data/.runner ]; then
          forgejo-runner create-runner-file \
            --instance "$${FORGEJO_INSTANCE_URL}" \
            --name nexus-runner \
            --secret "$${FORGEJO_RUNNER_SECRET}"
        fi
        exec forgejo-runner daemon --config /data/runner-config.yml
    mem_limit: 512m
    # Wait for the daemon to answer before starting. Without it the
    # runner spends its first minutes in a restart loop logging
    # "cannot ping the docker daemon", which buries any real error.
    depends_on:
      forgejo-dind:
        condition: service_healthy
    volumes:
      # Bind mount rather than a named volume: the runner drops to
      # 1001:1001, and a fresh named volume would come up root-owned so
      # `create-runner-file` could not write .runner. setup.py chowns
      # this path, the same way it does for the forge's own mounts.
      - /mnt/nexus-data/forgejo-runner:/data
      - ./runner-config.yml:/data/runner-config.yml:ro
      - forgejo-dind-socket:/run/dind
    networks:
      # app-network to reach the forge, which lives in the `forgejo`
      # stack. forgejo-ci only for the cache server the runner starts
      # for jobs: runner-config.yml advertises this fixed address as
      # `cache.host`, since a job cannot reach the runner any other way.
      app-network: {}
      forgejo-ci:
        ipv4_address: 10.213.0.11

volumes:
  # Named volume, not a bind mount: this is the CI layer cache. It is
  # rebuildable and it grows without bound. Keeping it out of
  # /mnt/nexus-data also keeps it out of the persistence targets — a CI
  # layer cache is not state worth carrying across a teardown.
  forgejo-dind-data:
  # The daemon's socket, shared by forgejo-dind and forgejo-runner only.
  forgejo-dind-socket:

networks:
  app-network:
    external: true
  # forgejo-dind, forgejo-git-proxy and forgejo-runner.
  #
  # A fixed subnet, because two addresses on it are written into
  # runner-config.yml. 10.213.0.0/24 lies outside Docker's default
  # address pools (172.17-31.x and 192.168.x), which both this host and
  # forgejo-dind allocate from. A job network inside forgejo-dind with
  # the same range would capture the traffic meant for these addresses.
  # Hetzner's own gateway is 172.31.1.1, another reason to stay out of
  # 172.x.
  forgejo-ci:
    driver: bridge
    ipam:
      config:
        - subnet: 10.213.0.0/24
