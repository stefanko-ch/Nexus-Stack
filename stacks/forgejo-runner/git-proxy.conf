# =============================================================================
# forgejo-git-proxy — the forge, as seen from an Actions job
# =============================================================================
# Jobs clone from https://forgejo-tls:3443, the address the runner
# registered with. runner-config.yml maps `forgejo-tls` to this
# container's fixed address on forgejo-ci; this terminates TLS and
# forwards the connection to the real forge on app-network. See the
# header of docker-compose.yml.
#
# WHY TLS, given that both ends sit on the same host (#888):
# The job's GITHUB_API_URL is this address, and scripts/repo-secret.sh
# refuses to send a repository-write token to a cleartext URL that is
# not loopback. It is right to: the connection crosses two Docker
# bridges, and every container on either of them can see it. So the
# proxy speaks TLS and the guard needs no exception.
#
# The certificate is generated per server by nexus_deploy.setup
# (ensure_data_dirs), before this container starts, and is trusted by
# the runner and by every job container. It is self-signed, valid for
# `forgejo-tls` only, and it never leaves the box.
#
# The hop from here to the forge stays plaintext, on app-network. That
# is the same hop every other stack uses to reach the forge, and it is
# not what #888 is about: the token is safe from the job to here, and
# from here on the traffic is indistinguishable from Kestra's or
# Woodpecker's.
#
# A stream (TCP) forward rather than an HTTP proxy: git, the API and
# artifact uploads pass through byte for byte, with no body size limit of
# nginx's own to hit.
#
# Timeouts: proxy_connect_timeout below only bounds connecting to the
# forge. An established connection is closed after proxy_timeout, which
# is left at its default of 10m and counts time with no data in either
# direction. A clone or upload that is transferring never reaches it;
# the runner's own `timeout: 30m` is a limit on the job, not on a
# connection, and does not call for a longer value here.
# =============================================================================

worker_processes 1;

events {
    worker_connections 256;
}

stream {
    # Docker's embedded DNS. Resolving per connection, rather than once at
    # startup, lets this start before the forgejo stack and follow the
    # forge to a new address when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 3443 ssl;
        # Mounted read-only from /mnt/nexus-data/forgejo-ci-tls, which
        # setup.py fills before compose up. nginx's master process reads
        # these as root, which is why the key can stay 0600.
        ssl_certificate /etc/nginx/tls/proxy.crt;
        ssl_certificate_key /etc/nginx/tls/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:forgejo_ci:1m;
        ssl_session_timeout 10m;

        set $forge forgejo:3000;
        proxy_pass $forge;
        proxy_connect_timeout 10s;
    }
}
