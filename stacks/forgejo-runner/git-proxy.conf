# =============================================================================
# forgejo-git-proxy — the forge, as seen from an Actions job
# =============================================================================
# Jobs clone from http://forgejo:3000, the address the runner registered
# with. runner-config.yml maps `forgejo` to this container's fixed address
# on forgejo-ci; this forwards the connection to the real forge on
# app-network. See the header of docker-compose.yml.
#
# A stream (TCP) forward rather than an HTTP proxy: git, the API and
# artifact uploads pass through byte for byte, with no body size limit or
# timeout of nginx's own to hit.
# =============================================================================

worker_processes 1;

events {
    worker_connections 256;
}

stream {
    # Docker's embedded DNS. Resolving per connection, rather than once at
    # startup, lets this start before the forgejo stack and follow the
    # forge to a new address when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 3000;
        set $forge forgejo:3000;
        proxy_pass $forge;
        proxy_connect_timeout 10s;
    }
}
