# =============================================================================
# Forgejo - Self-hosted Git Forge with built-in Actions CI
# =============================================================================
# Community-governed hard fork of Gitea. Accessible via:
#   https://forgejo.<domain>
#
# Port: 3202 (Web UI + API)
#
# Default credentials:
#   Admin user created automatically via CLI
#   Credentials: Generated by OpenTofu (stored in Infisical)
#
# Repository data and database live under /mnt/nexus-data/forgejo/.
# That path survives a SNAPSHOT teardown, which images the whole disk.
# It does NOT survive a REBUILD teardown: the R2 persistence layer
# copies a hardcoded set of stacks and Forgejo is not yet one of them,
# so the server is destroyed and the data with it. R2 coverage lands
# with the role swap — see docs/stacks/forgejo.md.
#
# FOUR CONTAINERS, one stack. The runner is not a separate stack on
# purpose: it is useless without Forgejo, it shares Forgejo's
# registration secret, and the Control Plane should show one switch
# rather than two that must be flipped together.
#
#   forgejo         the forge itself
#   forgejo-db      its own PostgreSQL (never the shared one)
#   forgejo-runner  executes Actions jobs
#   forgejo-dind    the Docker daemon those jobs run against
#
# SECURITY — read before enabling this on a shared stack:
# Anyone who can push to a repository here can execute code on the
# runner. That is not a Forgejo quirk; it is what self-hosted CI is.
# Three things bound the blast radius:
#   1. The job daemon is `dind-rootless`, so a container escape lands
#      as UID 1000 inside forgejo-dind rather than as root.
#   2. forgejo-dind sits alone with the runner on `forgejo-ci` and
#      publishes no port, so its unauthenticated 2375 is reachable
#      ONLY by forgejo-runner. It is deliberately not on
#      `forgejo-internal`: the web/API container and the database live
#      there, and a compromise of either would otherwise be able to
#      drive a privileged Docker daemon.
#   3. runner-config.yml leaves `container.docker_host: "-"` and
#      `valid_volumes: []`, so job containers get no Docker socket of
#      their own and cannot bind-mount host paths.
# `privileged: true` on forgejo-dind is still required — the rootless
# variant needs it to unmask seccomp/AppArmor. Rootless reduces the
# damage; it does not remove the privilege. See docs/stacks/forgejo.md.
#
# WHAT IS *NOT* PROTECTED — the runner's registration secret:
# `forgejo-runner create-runner-file` accepts the secret only as
# `--secret <value>`; upstream provides no stdin or file variant. So on
# the runner side the value is unavoidably in that process's argv while
# it runs, and it is in the container environment via `env_file`, which
# `docker inspect` shows. Both require host-level Docker access to
# observe. The call is guarded on `.runner` not existing, so the argv
# window is first boot only rather than every restart. The server-side
# half has no such constraint and does keep it out of argv — see
# src/nexus_deploy/forgejo_runner.py.
#
# Documentation: https://forgejo.org/docs/latest/
# =============================================================================

services:
  forgejo:
    image: ${IMAGE_FORGEJO:-codeberg.org/forgejo/forgejo:15.0.7}
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "3202:3000"
    # No `env_file:`. The stack's .env also holds FORGEJO_RUNNER_SECRET,
    # and the forge has no use for it — attaching the whole file would
    # put the runner's registration credential into the environment of
    # the one process exposed to the internet. The `${...}` entries
    # below are substituted by compose from that same .env, so each
    # container receives only what it names.
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: nexus-forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      # FORGEJO_HOST, not `forgejo.${DOMAIN}`. The renderer composes it
      # with the configured subdomain separator, so a flat-subdomain
      # tenant gets `forgejo-user1.example.com` — matching the DNS and
      # Access records Tofu provisions — instead of a dotted host that
      # resolves nowhere.
      FORGEJO__server__ROOT_URL: https://${FORGEJO_HOST}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_HOST}
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      # Actions is enabled by default since Forgejo v1.21; set explicitly
      # so a future default flip cannot silently disable CI.
      FORGEJO__actions__ENABLED: "true"
      # Where a bare `uses: actions/checkout@v4` resolves. Without this
      # students copying a GitHub workflow would reach out to github.com,
      # which defeats the point of a self-hosted forge.
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org
    # `mem_limit`, not `deploy.resources.limits`, and the reason is
    # uncertainty rather than a flat claim about either key.
    # `deploy.resources` began as a Swarm-only setting honoured under
    # `--compatibility`; some Compose v2 releases apply it directly.
    # This project installs Docker from an unpinned get.docker.com, so
    # the Compose version on any given server is not known in advance
    # — which is precisely why the ambiguous key is the wrong one here.
    # `mem_limit` is applied by every version.
    #
    # Worth the divergence from the repo's style for this stack in
    # particular: it runs arbitrary repository workflows, and a limit
    # that may or may not bind is worse than none, because it reads as
    # protection.
    mem_limit: 1g
    volumes:
      - /mnt/nexus-data/forgejo/repos:/data/git/repositories
      - /mnt/nexus-data/forgejo/lfs:/data/git/lfs
      - forgejo_data:/data
    depends_on:
      forgejo-db:
        condition: service_healthy
    networks:
      - app-network
      - forgejo-internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  forgejo-db:
    image: ${IMAGE_FORGEJO_POSTGRES:-postgres:17-alpine}
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus-forgejo
      POSTGRES_DB: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
    mem_limit: 512m
    volumes:
      - /mnt/nexus-data/forgejo/db:/var/lib/postgresql/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus-forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  forgejo_data:

networks:
  app-network:
    external: true
  # forgejo + forgejo-db. The Actions runner lives in its own stack and
  # reaches the forge over app-network, so it does not need a seat here.
  forgejo-internal:
    driver: bridge
