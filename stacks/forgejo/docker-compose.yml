# =============================================================================
# Forgejo - Self-hosted Git Forge with built-in Actions CI
# =============================================================================
# Community-governed hard fork of Gitea. Accessible via:
#   https://forgejo.<domain>
#
# Port: 3202 (Web UI + API)
#
# Default credentials:
#   Admin user created automatically via CLI
#   Credentials: Generated by OpenTofu (stored in Infisical)
#
# Repository data and database live under /mnt/nexus-data/forgejo/ and
# survive BOTH lifecycles: a disk snapshot images them wholesale, and a
# rebuild teardown copies the repositories and LFS objects to R2 and
# takes a pg_dump of the database first. That coverage was added when
# Forgejo became core — see s3_restore.standard_targets().
#
# TWO CONTAINERS:
#
#   forgejo     the forge itself
#   forgejo-db  its own PostgreSQL (never the shared one)
#
# The Actions runner is a separate, optional stack — see
# stacks/forgejo-runner/. This one is core and runs everywhere; that
# one carries a privileged docker-in-docker container and should only
# exist where somebody actually uses CI.
#
# The security notes about running untrusted workflow code moved
# with the container they describe — see stacks/forgejo-runner/.
#
# Documentation: https://forgejo.org/docs/latest/
# =============================================================================

services:
  forgejo:
    image: ${IMAGE_FORGEJO:-codeberg.org/forgejo/forgejo:15.0.7}
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "3202:3000"
    # No `env_file:`. The `${...}` entries below are substituted by
    # compose from the stack's .env, so each container receives only
    # what it names rather than the whole file.
    #
    # The registration secret is not in this file at all any more — it
    # is rendered into the separate forgejo-runner stack's own .env.
    # Naming values explicitly is still the right habit: it keeps the
    # internet-facing process's environment to what it actually uses.
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: nexus-forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      # FORGEJO_HOST rather than an inline `forgejo.${DOMAIN}`, so the
      # reasoning lives with the renderer. Note it composes a plain dot
      # and deliberately does NOT use subdomain_separator: the DNS
      # record, tunnel ingress and Access application in main.tf are
      # all `${subdomain}.${var.domain}`, so anything else would have
      # Forgejo advertise a host nothing routes to.
      FORGEJO__server__ROOT_URL: https://${FORGEJO_HOST}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_HOST}
      # No SSH port is published and the tunnel's SSH ingress is a
      # different hostname, so an advertised `git@forgejo.<domain>`
      # clone URL routes nowhere. Turned off rather than left as a
      # URL the UI offers and nothing serves.
      #
      # Not a permanent decision: deploy-key access over SSH is a
      # plausible thing for Nexus Conductor to want. Turning it back on
      # means publishing a port and adding a `tcp_ports` entry — 2222 is
      # free, 2022 belongs to SFTPGo.
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      # Actions is enabled by default since Forgejo v1.21; set explicitly
      # so a future default flip cannot silently disable CI.
      FORGEJO__actions__ENABLED: "true"
      # Where a bare `uses: actions/checkout@v4` resolves. Without this
      # students copying a GitHub workflow would reach out to github.com,
      # which defeats the point of a self-hosted forge.
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org
    # `mem_limit`, not `deploy.resources.limits`, and the reason is
    # uncertainty rather than a flat claim about either key.
    # `deploy.resources` began as a Swarm-only setting honoured under
    # `--compatibility`; some Compose v2 releases apply it directly.
    # This project installs Docker from an unpinned get.docker.com, so
    # the Compose version on any given server is not known in advance
    # — which is precisely why the ambiguous key is the wrong one here.
    # `mem_limit` is applied by every version.
    #
    # Worth the divergence from the repo's style for this stack in
    # particular: it runs arbitrary repository workflows, and a limit
    # that may or may not bind is worse than none, because it reads as
    # protection.
    mem_limit: 1g
    volumes:
      - /mnt/nexus-data/forgejo/repos:/data/git/repositories
      - /mnt/nexus-data/forgejo/lfs:/data/git/lfs
      - forgejo_data:/data
    depends_on:
      forgejo-db:
        condition: service_healthy
    networks:
      - app-network
      - forgejo-internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  forgejo-db:
    image: ${IMAGE_FORGEJO_POSTGRES:-postgres:17-alpine}
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus-forgejo
      POSTGRES_DB: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
    mem_limit: 512m
    volumes:
      - /mnt/nexus-data/forgejo/db:/var/lib/postgresql/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus-forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  forgejo_data:

networks:
  app-network:
    external: true
  # forgejo + forgejo-db. The Actions runner lives in its own stack and
  # reaches the forge over app-network, so it does not need a seat here.
  forgejo-internal:
    driver: bridge
