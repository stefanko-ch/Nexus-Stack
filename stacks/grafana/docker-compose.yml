# =============================================================================
# Grafana Observability Stack
# =============================================================================
# Full monitoring solution: Metrics, Logs, Dashboards, Alerting
#
# Components:
#   - Grafana:       Dashboards & Alerting (external 3100 → internal 3000)
#   - Prometheus:    Metrics collection
#   - Loki:          Log aggregation
#   - Promtail:      Log shipping from Docker
#   - cAdvisor:      Container metrics
#   - Node Exporter: Host metrics
#
# Access: https://grafana.YOUR_DOMAIN
# Default: admin / (generated password)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Grafana - Dashboards & Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: ${IMAGE_GRAFANA:-grafana/grafana:11.6}
    container_name: grafana
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?must be set in .env (rendered by service_env._render_grafana)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_BASIC_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network
      - grafana-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: ${IMAGE_PROMETHEUS:-prom/prometheus:v3.9.1}
    container_name: grafana-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network
      - grafana-internal

  # ---------------------------------------------------------------------------
  # Loki - Log Aggregation
  # ---------------------------------------------------------------------------
  loki:
    image: ${IMAGE_LOKI:-grafana/loki:3}
    container_name: grafana-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - grafana-internal

  # ---------------------------------------------------------------------------
  # Promtail - Log Collector (ships Docker logs to Loki)
  # ---------------------------------------------------------------------------
  promtail:
    image: ${IMAGE_PROMTAIL:-grafana/promtail:3}
    container_name: grafana-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - grafana-internal

  # ---------------------------------------------------------------------------
  # cAdvisor - Container Metrics
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ${IMAGE_CADVISOR:-ghcr.io/google/cadvisor:0.56}
    container_name: grafana-cadvisor
    restart: unless-stopped
    # Deliberately NOT privileged. cAdvisor's own docs name two cases that
    # require it, and neither applies here:
    #
    #   - process metrics (`--enable_metrics=process`), which also need
    #     `--pid=host`. Not enabled; the dashboards in
    #     provisioning/dashboards/json/ read container_cpu_usage_seconds_total,
    #     container_memory_usage_bytes, container_last_seen and the network
    #     counters, all of which come from the read-only /sys cgroup mount.
    #   - RHEL and CentOS, which lock containers down further. The servers
    #     run Ubuntu 26.04.
    #
    # A privileged container gets every capability, an unconfined seccomp
    # profile and host device access. That matters more here than elsewhere:
    # this is the one stack wired to observe all the others, and it mounts
    # the Docker socket, so a compromise of it is a compromise of the host.
    #
    # /dev/kmsg is passed explicitly instead — cAdvisor reads it to detect
    # OOM kills, which is the one capability the privileged flag was
    # silently providing. See docs/stacks/grafana.md for what to check if a
    # panel goes blank after this change.
    devices:
      # `:r` — read only. Docker's default for a device entry is `rwm`
      # (read, write, mknod), which would let a compromised cAdvisor write
      # arbitrary lines into the host kernel log. cAdvisor only reads
      # /dev/kmsg, so granting more would undo part of what dropping
      # `privileged` bought.
      - /dev/kmsg:/dev/kmsg:r
    # Cardinality defuse (Conductor #23 highest-priority):
    # --docker_only=true        ignore non-Docker cgroups (k8s/systemd noise)
    # --store_container_labels=false
    #                           by default cAdvisor turns every Docker
    #                           label into a Prometheus label, so a single
    #                           stack with a long Compose-generated network
    #                           name can spawn thousands of new series per
    #                           container. Disabling this caps per-stack
    #                           cardinality at ~50-200 instead of unbounded.
    # Both flags are safe locally too — Grafana dashboards key off
    # container_name / id, not Docker labels.
    command:
      - '--docker_only=true'
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - grafana-internal

  # ---------------------------------------------------------------------------
  # Node Exporter - Host Metrics (CPU, RAM, Disk, Network)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: ${IMAGE_NODE_EXPORTER:-prom/node-exporter:v1.10.2}
    container_name: grafana-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - grafana-internal

volumes:
  grafana-data:
  prometheus-data:
  loki-data:

networks:
  app-network:
    external: true
  grafana-internal:
    driver: bridge
