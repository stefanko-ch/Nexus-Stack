# =============================================================================
# Lakekeeper - Iceberg REST Catalog (Rust)
# =============================================================================
# Open-source implementation of the Apache Iceberg REST Catalog spec.
# Single Rust binary + dedicated PostgreSQL for metadata storage.
# Lets Spark, Trino, DuckDB, PyIceberg, and the Iceberg Java/Python
# SDK all read + write the SAME Iceberg tables on the existing
# object storage (Garage / MinIO / SeaweedFS / RustFS / external R2).
#
# Architecture:
#   - lakekeeper-bootstrap: one-shot `migrate` job that initialises
#     the Postgres schema on first start, then exits
#   - lakekeeper:           long-running `serve` process on :8181
#   - lakekeeper-db:        dedicated Postgres 17, NOT shared with
#                           any other stack (per project convention
#                           for stateful services)
#
# Auth: `LAKEKEEPER__AUTHZ_BACKEND=allow-all`. Cloudflare Access
# (email OTP) gates the published browser route and nothing else —
# the catalog's REST API is on app-network, so any other container
# reaches it without credentials or an Access session. That is how
# Spark, Trino and DuckDB use it, but it means the boundary is the
# Docker network rather than Access. Lakekeeper has its own OIDC
# layer for fine-grained per-team table permissions; that's out of
# scope for the baseline "one team per stack" model.
#
# Access: https://lakekeeper.YOUR_DOMAIN
# Spec: https://github.com/apache/iceberg/blob/main/open-api/rest-catalog-open-api.yaml
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Lakekeeper Bootstrap - one-shot DB migration
  # ---------------------------------------------------------------------------
  # Runs `migrate` to create / upgrade the Postgres schema, then
  # exits with rc=0. Lakekeeper itself waits for this via
  # service_completed_successfully so subsequent restarts don't
  # re-run the migration. Splitting it out (vs. `bash -c "migrate &&
  # serve"`) makes the lifecycle explicit + lets Docker's restart
  # policy do the right thing for each role.
  lakekeeper-bootstrap:
    image: ${IMAGE_LAKEKEEPER:-quay.io/lakekeeper/catalog:v0.13.3}
    container_name: lakekeeper-bootstrap
    restart: "no"
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://nexus-lakekeeper:${LAKEKEEPER_DB_PASSWORD}@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://nexus-lakekeeper:${LAKEKEEPER_DB_PASSWORD}@lakekeeper-db:5432/lakekeeper
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    networks:
      - lakekeeper-internal

  # ---------------------------------------------------------------------------
  # Lakekeeper Catalog - REST API server
  # ---------------------------------------------------------------------------
  lakekeeper:
    image: ${IMAGE_LAKEKEEPER:-quay.io/lakekeeper/catalog:v0.13.3}
    container_name: lakekeeper
    env_file:
      - .env
    restart: unless-stopped
    ports:
      # Host port 8195 → container 8181. Kafka-UI already binds host 8181
      # (mapping to its container's 8080), so Lakekeeper has to publish on
      # a different host port to avoid a docker-compose port collision
      # when both stacks are enabled. Container port stays 8181 (the
      # upstream Lakekeeper default) so internal references + the
      # healthcheck URL below don't change.
      - "8195:8181"
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://nexus-lakekeeper:${LAKEKEEPER_DB_PASSWORD}@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://nexus-lakekeeper:${LAKEKEEPER_DB_PASSWORD}@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__BASE_URI: https://${LAKEKEEPER_DOMAIN}
      # Auth disabled internally — CF Access at the edge is the gate.
      # Flip to "openid" + LAKEKEEPER__OPENID_PROVIDER_URI if you
      # later want fine-grained per-team table permissions inside
      # Lakekeeper itself (see docs/stacks/lakekeeper.md).
      LAKEKEEPER__AUTHZ_BACKEND: allow-all
      # Encrypts the warehouse storage credentials Lakekeeper keeps in
      # Postgres. Left unset, it logs "THIS IS UNSAFE! Using default
      # encryption key for secrets in postgres" and uses a built-in key, so
      # the R2 secret would sit in the catalogue database under an encryption
      # anyone can reverse. Must stay stable across spin-ups, or previously
      # stored credentials stop decrypting -- see _render_lakekeeper for why
      # it reuses the DB password rather than adding a second secret.
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      lakekeeper-db:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    networks:
      - app-network
      - lakekeeper-internal
    healthcheck:
      # CMD, not CMD-SHELL, and the binary's own subcommand rather than wget.
      # This image is distroless: the only executable in it is
      # /home/nonroot/lakekeeper. There is no /bin/sh and no wget, so a
      # CMD-SHELL probe cannot start at all -- it exits 127 with
      # `stat /bin/sh: no such file or directory` and the container is marked
      # unhealthy forever, however well the server is actually running.
      # Measured against both v0.12.2 and v0.13.3, so this was already the
      # case before the version bump; it went unnoticed because nothing in the
      # deploy pipeline waits on container health.
      #
      # `healthcheck -s` calls the server's own /health endpoint and exits 0
      # when it answers, 1 when nothing is listening (verified both ways).
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck", "-s"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Lakekeeper - Dedicated PostgreSQL (catalog metadata)
  # ---------------------------------------------------------------------------
  lakekeeper-db:
    image: ${IMAGE_LAKEKEEPER_DB:-postgres:17-alpine}
    container_name: lakekeeper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus-lakekeeper
      POSTGRES_PASSWORD: ${LAKEKEEPER_DB_PASSWORD}
      POSTGRES_DB: lakekeeper
    volumes:
      # Bind mount under /mnt/nexus-data rather than a named volume, matching
      # gitea-db / forgejo-db / dify-db / unity-catalog-db. Two reasons, and
      # only the second is about this stack:
      #   - the snapshot lifecycle images the disk, and a path under
      #     /mnt/nexus-data is where the other stateful stacks keep their data
      #   - s3_restore's PostgresDumpTarget for lakekeeper-db needs the
      #     database to exist at a predictable place across a rebuild
      # Without the dump, an R2-backed warehouse survives a teardown while the
      # catalogue that names its tables does not -- Parquet files in a bucket
      # nothing can resolve.
      - /mnt/nexus-data/lakekeeper/db:/var/lib/postgresql/data
    networks:
      - lakekeeper-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus-lakekeeper -d lakekeeper"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    external: true
  lakekeeper-internal:
    driver: bridge
