# =============================================================================
# Marquez - OpenLineage reference backend (data lineage)
# =============================================================================
# Collects OpenLineage events from the orchestrators already in this stack
# and turns them into a queryable graph: which job read which dataset, what
# it produced, and which run did it. Answers "where did this table come
# from, and what breaks if I change it?" — the one thing no other stack here
# can answer today.
#
# Architecture:
#   - marquez:     Dropwizard API on :5000 (+ admin :5001). Internal only —
#                  producers reach it at http://marquez:5000 over
#                  app-network. Flyway migrations run on boot.
#   - marquez-web: Node process that serves the built React UI AND proxies
#                  /api to the backend (upstream's docker/entrypoint.sh runs
#                  `node setupProxy.js`). This is why only the web container
#                  needs a published port: the browser never talks to the
#                  API directly, so the API needs no subdomain of its own.
#   - marquez-db:  dedicated Postgres 16, NOT shared with any other stack
#                  (per project convention for stateful services).
#   - marquez-opensearch: backs fuzzy search. Without it name and namespace
#                  search still work against Postgres; this adds full-text
#                  and typo-tolerant matching.
#
# Config: config/marquez.yml is bind-mounted and selected via MARQUEZ_CONFIG.
# The image's bundled marquez.dev.yml hardcodes user/password as
# `marquez`/`marquez`, so there is no route to the nexus- account
# convention or a generated password without replacing it.
#
# Auth: none in Marquez itself — it ships no user management, and
# Cloudflare Access at the edge is the gate, same model as Lakekeeper. The
# two generated secrets are the Postgres password and the OpenSearch admin
# password; neither is a user login.
#
# Sending lineage from inside the stack:
#   Dagster    — OpenLineage is built in; point it at http://marquez:5000
#   Spark      — io.openlineage:openlineage-spark listener
#   dbt        — `dbt-ol run` wrapper from the openlineage-dbt package
#   Kestra     — POST to http://marquez:5000/api/v1/lineage
#
# Arch note: marquezproject/marquez publishes linux/amd64 only. The servers
# have run x86 (cx43) since 2026-05, so this is not a constraint in
# practice; it does mean the image needs emulation on an Apple Silicon
# laptop, which only matters for hand-poking an image locally.
#
# Access: https://marquez.YOUR_DOMAIN
# Docs:   https://marquezproject.ai
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Marquez API - OpenLineage ingest + metadata store
  # ---------------------------------------------------------------------------
  marquez:
    image: ${IMAGE_MARQUEZ:-marquezproject/marquez:0.51.1}
    container_name: marquez
    env_file:
      - .env
    restart: unless-stopped
    environment:
      # Selects our config over the image's marquez.dev.yml. Without it the
      # entrypoint logs "WARNING 'MARQUEZ_CONFIG' not set" and silently uses
      # the development file with its hardcoded credentials.
      MARQUEZ_CONFIG: /opt/marquez/config/marquez.yml
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: nexus-marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      SEARCH_ENABLED: "true"
      SEARCH_HOST: marquez-opensearch
      SEARCH_PORT: 9200
      SEARCH_USERNAME: admin
      SEARCH_PASSWORD: ${MARQUEZ_OPENSEARCH_PASSWORD}
    volumes:
      - ./config/marquez.yml:/opt/marquez/config/marquez.yml:ro
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      marquez-db:
        condition: service_healthy
      marquez-opensearch:
        condition: service_healthy
    networks:
      - app-network
      - marquez-internal
    healthcheck:
      # The admin connector serves /healthcheck; the application port does
      # not. Probing :5000 would report failure on a healthy server.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Marquez Web - React UI + API proxy
  # ---------------------------------------------------------------------------
  marquez-web:
    image: ${IMAGE_MARQUEZ_WEB:-marquezproject/marquez-web:0.51.1}
    container_name: marquez-web
    restart: unless-stopped
    environment:
      # Consumed by setupProxy.js to reach the backend over the Docker
      # network. The browser only ever talks to this container.
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      # Host 3210 → container 3000. Ports 3200-3202 are taken by other
      # stacks; the container port stays at upstream's default.
      - "3210:3000"
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - marquez
    networks:
      - app-network
      - marquez-internal

  # ---------------------------------------------------------------------------
  # Marquez - OpenSearch (fuzzy search index)
  # ---------------------------------------------------------------------------
  # Backs Marquez's advanced search. Without it, name and namespace search
  # still work against PostgreSQL — this container buys full-text and
  # typo-tolerant matching across jobs, datasets and fields.
  #
  # Upstream pins 2.5.0 (January 2023). This uses the current 2.x instead:
  # same major, so the REST surface Marquez talks to is unchanged, and three
  # years of fixes are worth more than matching their pin exactly. If search
  # ever misbehaves after a Marquez upgrade, 2.5.0 is the reference point to
  # compare against.
  #
  # bootstrap.memory_lock keeps the JVM heap out of swap, which needs both
  # the memlock ulimit and IPC_LOCK. Without them OpenSearch starts but logs
  # a warning and can be paged out mid-query.
  marquez-opensearch:
    image: ${IMAGE_MARQUEZ_OPENSEARCH:-opensearchproject/opensearch:2.19.6}
    container_name: marquez-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # TLS off on the HTTP layer: the traffic never leaves
      # marquez-internal, and leaving it on would require Marquez to trust
      # the bundled demo certificate. Authentication stays on.
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Mandatory since 2.12 and validated on start: at least one upper,
      # one lower, one digit and one special character, plus a zxcvbn
      # strength check. Generated by random_password.marquez_opensearch_admin,
      # one of only two passwords in main.tf that enable special characters
      # (openmetadata_admin is the other) — and the only one restricted to
      # `-_.`, so the value stays inert in a shell, a .env parser and YAML.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${MARQUEZ_OPENSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - marquez-opensearch-data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          # Heap is capped at 512m above; the rest is off-heap plus Lucene's
          # file cache. 2g total is the same ceiling the other JVM stacks use.
          memory: 2g
    networks:
      - marquez-internal
    healthcheck:
      # No credentials in the probe. A 401 proves as much as a 200 does
      # here — OpenSearch is listening and its security plugin is loaded —
      # and passing the password would put it in the healthcheck process's
      # argument list, which the project forbids for secrets. A wrong
      # password then surfaces on Marquez's side with a clear message
      # rather than as an opaque unhealthy container.
      #
      # The probe deliberately contains no dollar sign. An anchored regex
      # would need one, and that stacks two under-specified behaviours:
      # docker compose's `$$` escaping, and how a given grep treats a `$`
      # that is not the final character. `grep -qxF` matches the whole
      # line against fixed strings and needs neither, while still
      # rejecting a stray 2001. Getting this wrong is expensive here —
      # marquez waits on `condition: service_healthy`, so a probe that can
      # never pass deadlocks the stack rather than degrading it.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -qxF -e 200 -e 401"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Marquez - Dedicated PostgreSQL (lineage graph)
  # ---------------------------------------------------------------------------
  marquez-db:
    image: ${IMAGE_MARQUEZ_DB:-postgres:16-alpine}
    container_name: marquez-db
    restart: unless-stopped
    environment:
      # Creating the role and database directly through POSTGRES_USER /
      # POSTGRES_DB avoids upstream's docker/init-db.sh, which exists only
      # because their compose connects as the postgres superuser and then
      # provisions a second account.
      POSTGRES_USER: nexus-marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    networks:
      - marquez-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus-marquez -d marquez"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  marquez-db-data:
  marquez-opensearch-data:

networks:
  app-network:
    external: true
  marquez-internal:
    driver: bridge
