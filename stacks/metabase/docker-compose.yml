# =============================================================================
# Metabase - Business Intelligence Tool
# https://metabase.${DOMAIN}
# =============================================================================
# Metabase is an easy-to-use, open-source business intelligence tool.
# Create dashboards, ask questions about your data, and share insights.
# Default login: admin@metabase.local / (generated password in Infisical)
#
# Data persistence: Metabase's internal H2/DB + user-created dashboards,
# questions, collections, pulses live in /metabase-data, bind-mounted
# onto the persistent Hetzner Volume at /mnt/nexus-data/metabase/.
# Survives teardown — students who build dashboards across multiple
# sessions keep their work (issue #528).
#
# Trade-off (same as Gitea/Dify): the data dir survives `tofu destroy`
# (the Hetzner volume is preserved by destroy-all). It does NOT survive
# `gh workflow run destroy-all.yml -f confirm=DESTROY` which explicitly
# wipes /mnt/nexus-data/.
# =============================================================================

services:
  metabase:
    image: ${IMAGE_METABASE:-metabase/metabase:latest}
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MB_SITE_NAME=Nexus Stack Analytics
      - MB_SITE_URL=https://metabase.${DOMAIN}
      - MB_ADMIN_EMAIL=nexus@metabase.local
      - MB_ANON_TRACKING_ENABLED=false
      - JAVA_TIMEZONE=Europe/Zurich
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - /mnt/nexus-data/metabase:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

networks:
  app-network:
    external: true
