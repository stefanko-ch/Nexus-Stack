# =============================================================================
# MongoDB - document database, with mongo-express as its web UI
# =============================================================================
# Closes the document/NoSQL gap: every other database here is relational,
# columnar, time-series, streaming or a vector store. Plenty of application
# code and tutorials expect a MongoDB to be there.
#
# Architecture:
#   - mongodb:          the server, wire protocol on :27017, auth ON
#   - mongodb-express:  the web UI on :8081, published on host 8105 — the
#                       only thing the tunnel routes to
#
# Auth, split the same way as OpenSearch and its Dashboards:
#   - The wire protocol authenticates. The root user `nexus-mongodb` is
#     created on first start from MONGO_INITDB_ROOT_*, with a password
#     generated by OpenTofu. Notebooks and pipelines on app-network, and
#     external clients once the firewall rule is enabled, all have to
#     present it.
#   - mongo-express's own basic auth is OFF, because Cloudflare Access at
#     the edge already authenticated whoever reaches it. The image turns it
#     ON by default with `admin` / `pass`, which is why it is switched off
#     explicitly below rather than left to the image.
#
# Reaching it from inside the stack (Jupyter, Marimo, code-server):
#   from pymongo import MongoClient
#   client = MongoClient("mongodb://mongodb:27017",
#                        username="nexus-mongodb",
#                        password="<Infisical → mongodb → MONGODB_ROOT_PASSWORD>")
#
# The password is NOT injected into the notebook containers' environment;
# this stack's rendered .env is read by this stack alone.
#
# External clients (Compass, mongosh, a driver on your laptop): port 27017 is
# NOT published by this file. Enable the `wire` rule on the `mongodb` card in
# Control Plane → Firewall and Spin Up; the generated docker-compose.firewall.yml then
# publishes 27017:27017 on the first service below. That is why `mongodb`
# must stay the first service in this file.
#
# Access: https://mongodb.YOUR_DOMAIN
# Docs:   https://www.mongodb.com/docs/manual/
#         https://github.com/mongo-express/mongo-express
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MongoDB - the server. Keep this the FIRST service: the firewall override
  # targets the first key under `services:` (firewall.get_compose_first_service).
  # ---------------------------------------------------------------------------
  mongodb:
    image: ${IMAGE_MONGODB:-mongo:8.0.30}
    container_name: mongodb
    restart: unless-stopped
    # Arguments starting with `--` are appended to `mongod` by the image's
    # entrypoint, which also adds --bind_ip_all and --auth when the root
    # user variables are set.
    #
    # The WiredTiger cache is pinned rather than derived. mongod defaults it
    # to 50% of (RAM - 1 GB), and MongoDB's own docs say that in a container
    # without access to all of the host's RAM you "must set
    # --wiredTigerCacheSizeGB" below the container's limit, because WiredTiger
    # may not account for it — in which case the host's 16 GB would size a
    # 7.5 GB cache inside a 2 GB limit. 1 GB leaves the other half of the limit for
    # connections, index builds and aggregation memory.
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      # `nexus-` prefix per the service-account naming rule. The entrypoint
      # creates this user in the `admin` database once, on an empty data
      # directory; on a later start with existing data it creates nothing
      # (see docs/stacks/mongodb.md, "First run").
      #
      # ⚠️ Both variables must stay set after that first run. The entrypoint
      # adds `--auth` to mongod only when both are non-empty, on EVERY start,
      # not just the first — remove them and the next start serves the
      # existing data with access control off.
      MONGO_INITDB_ROOT_USERNAME: nexus-mongodb
      # `:?` rather than a bare reference: an unset variable would otherwise
      # substitute an empty string. With the username set and the password
      # empty the entrypoint exits with "both must be specified"; failing in
      # compose instead names the file that is missing the value.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?must be set in .env (rendered by service_env._render_mongodb)}
    # No `ports:` for 27017, deliberately. Publishing it here as well as in
    # the firewall override would collide on the same host port after the
    # merge (#488). Cross-stack traffic reaches `mongodb:27017` over
    # app-network without any host port.
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - app-network
      - mongodb-internal
    healthcheck:
      # `ping` is one of the few commands MongoDB answers without
      # authentication, so the probe needs no password in its argument list
      # — which the project forbids for secrets. mongosh ships in the image.
      test: ["CMD-SHELL", "mongosh --quiet --norc --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qxF -e 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # mongo-express - the web UI
  # ---------------------------------------------------------------------------
  mongodb-express:
    image: ${IMAGE_MONGODB_EXPRESS:-mongo-express:1.0.2-20-alpine3.19}
    container_name: mongodb-express
    restart: unless-stopped
    ports:
      # Host 8105 → container 8081. mongo-express's own default is 8081, and
      # host 8081 is taken by Flink's web UI.
      #
      # Bound to 127.0.0.1: cloudflared reaches it over localhost, so nothing
      # is lost, and the host firewall stops being the only thing between an
      # unauthenticated UI and the internet (same as influxdb and weaviate,
      # #742).
      #
      # ⚠️ Never add a `tcp_ports` entry for this port. The UI has no login of
      # its own here — Cloudflare Access is its entire authentication story.
      - "127.0.0.1:8105:8081"
    environment:
      # Variable names verified against /app/config.default.js in the pinned
      # image, not against the README, which documents older names.
      #
      # The URL wins over the individual SERVER/ADMINUSERNAME variables
      # (config.default.js ignores it only when ME_CONFIG_MONGODB_SERVER is
      # set), and the image's own default is `mongodb://mongo:27017`, a host
      # that does not exist here. The password is 32 alphanumeric characters
      # (random_password.mongodb_root, special = false), so it needs no
      # percent-encoding inside the URL.
      ME_CONFIG_MONGODB_URL: mongodb://nexus-mongodb:${MONGODB_ROOT_PASSWORD:?must be set in .env (rendered by service_env._render_mongodb)}@mongodb:27017/?authSource=admin
      # Admin features on: server status, and every database rather than
      # only the one named in the URL. The UI connects as root anyway.
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # Basic auth OFF. The image sets ME_CONFIG_BASICAUTH=true with the
      # fallback credentials `admin` / `pass` — a documented default login on
      # a shared UI, exactly what the naming rule exists to prevent. With
      # Cloudflare Access in front, a second login would be friction without
      # protection, so it is turned off rather than given a generated
      # password (the OpenSearch Dashboards precedent).
      ME_CONFIG_BASICAUTH: "false"
      # The image default is the literal string `secret`. It is the
      # express-session signing key (lib/router.js), and the session is where
      # the CSRF middleware keeps its per-session secret. A generated value
      # costs nothing; a published one means anybody can produce a validly
      # signed session cookie.
      ME_CONFIG_SITE_SESSIONSECRET: ${MONGODB_EXPRESS_SESSION_SECRET:?must be set in .env (rendered by service_env._render_mongodb)}
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      mongodb:
        condition: service_healthy
    # Internal network only. The UI connects as root and has no login, so on
    # app-network any container in any stack could drive it. cloudflared
    # still reaches it through the published loopback port.
    networks:
      - mongodb-internal
    healthcheck:
      # wget, not curl: this image ships busybox wget and no curl, verified
      # with `ls` inside it. /status is registered before the rest of the
      # middleware (lib/router.js) and answers {"status":"ok"}.
      #
      # 127.0.0.1, NOT localhost. Measured: busybox wget resolves localhost
      # to ::1, mongo-express listens on 0.0.0.0 only, and the probe failed
      # with "Connection refused" while the UI answered 200 on the published
      # port — a permanently unhealthy container that works perfectly.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongodb-data:
  mongodb-config:

networks:
  app-network:
    external: true
  mongodb-internal:
    driver: bridge
