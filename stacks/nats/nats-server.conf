# NATS server configuration. Read by the image's default command
# (nats-server --config /etc/nats/nats-server.conf).

port: 4222
# Monitoring endpoints (/healthz, /varz, /jsz). Internal only, no auth.
http_port: 8222
server_name: nexus-nats

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 10GB
}

# NATS resolves $NATS_PASSWORD from the environment, so the password is in
# neither this file nor an argument list.
authorization {
  user: nexus-nats
  password: $NATS_PASSWORD
}
