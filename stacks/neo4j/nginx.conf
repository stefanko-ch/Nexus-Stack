# =============================================================================
# neo4j-proxy — one hostname for Neo4j Browser AND the Bolt connection it opens
# =============================================================================
# Neo4j Browser is a page served on the HTTP port (7474), but the queries it
# runs do not go back over that port. The page opens a Bolt connection from
# the user's browser, over WebSocket, to the Bolt port (7687). Through the
# Cloudflare Tunnel only one origin sits behind https://neo4j.<domain>, so
# without this proxy the page loads and the connection has nowhere to go.
#
# The split is on the Upgrade header, not on the path:
#   - `Upgrade: websocket` -> neo4j:7687 (Bolt accepts WebSocket on its own port)
#   - everything else      -> neo4j:7474 (Browser, discovery, Query API)
# Neo4j's HTTP port serves no WebSocket of its own, so nothing is lost by
# routing every upgrade to Bolt. Both halves were measured against the pinned
# image: a Bolt handshake over WebSocket to 7687 negotiates 5.8, the same
# handshake to 7474 is answered with a plain HTTP 200 and no upgrade.
#
# Because the WebSocket is same-origin with the page, the browser sends the
# Cloudflare Access cookie with the upgrade request — the same property that
# lets Wetty and Jupyter kernels work behind Access.
# =============================================================================

worker_processes 1;

events {
    worker_connections 256;
}

http {
    # Case-insensitive: RFC 6455 does not fix the case of the token.
    map $http_upgrade $neo4j_upstream {
        default          "neo4j:7474";
        "~*^websocket$"  "neo4j:7687";
    }

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       "";
    }

    server {
        listen 8080;

        # Docker's embedded DNS. The upstream is a variable, so nginx resolves
        # it per request instead of once at start — a recreated `neo4j`
        # container with a new address is picked up without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Answered by nginx itself, so the proxy's healthcheck says whether
        # the proxy is up, not whether Neo4j is.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://$neo4j_upstream;
            proxy_http_version 1.1;
            # $http_host, not $host: Neo4j builds its `/` -> `/browser/`
            # redirect and its discovery URLs from this header, and $host
            # drops the port. Through the tunnel the two are identical.
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # A Bolt session is long-lived and mostly idle between queries.
            # nginx's 60s default would cut it; this one does not.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
    }
}
