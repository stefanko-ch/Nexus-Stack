# nifi-proxy: HTTP from the tunnel in, HTTPS to NiFi out.
#
# NiFi 2.x serves HTTPS only, with a self-signed certificate it generates
# for its own host name, and refuses requests whose Host is not on that
# certificate. cloudflared reaches every origin as http://localhost:<port>,
# so this proxy takes plain HTTP and opens TLS to NiFi as `nifi` -- the
# container's hostname, which is what the certificate names.
#
# The public name travels in X-ProxyHost / X-ProxyScheme / X-ProxyPort, the
# headers NiFi uses to build its URLs. NiFi rejects an X-ProxyHost that is
# not listed in nifi.web.proxy.host, which the compose file sets from the
# rendered public host name.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    client_max_body_size 1g;
    proxy_read_timeout 300s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass https://nifi:8443;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name nifi;

            proxy_set_header Host nifi:8443;
            proxy_set_header X-ProxyScheme https;
            proxy_set_header X-ProxyHost $host;
            proxy_set_header X-ProxyPort 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
