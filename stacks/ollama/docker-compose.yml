# =============================================================================
# Ollama + Open WebUI - Local LLM Inference with Chat Interface
# =============================================================================
# Self-hosted LLM platform with Ollama as the inference backend and
# Open WebUI as the chat interface.
#
# Features:
#   - Run LLMs locally (Llama, Mistral, Gemma, Phi, etc.)
#   - ChatGPT-like web interface
#   - Model management (pull, delete, create custom models)
#   - Conversation history and user management
#   - RAG (Retrieval-Augmented Generation) support
#
# Access: https://ollama.YOUR_DOMAIN
# Login: the admin account created on first start (Infisical -> `open-webui`).
#
# Note: No GPU on Hetzner ARM servers - models run on CPU.
# Smaller models (1B-7B parameters) recommended for acceptable performance.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Ollama - LLM Inference Engine (internal only)
  # ---------------------------------------------------------------------------
  ollama:
    image: ${IMAGE_OLLAMA:-ollama/ollama:0.15.1}
    container_name: ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ollama-internal

  # ---------------------------------------------------------------------------
  # Open WebUI - Chat Interface
  # ---------------------------------------------------------------------------
  # Login: an admin account created on first start from
  # WEBUI_ADMIN_EMAIL / WEBUI_ADMIN_PASSWORD (the stack user's email and a
  # generated password, Infisical -> folder `open-webui`). Open WebUI does
  # this only while its user table is empty, and stores
  # `enable_signup=false` with it, so nobody else can register. It used to
  # be "first visitor to register becomes admin", with sign-up left open.
  open-webui:
    image: ${IMAGE_OLLAMA_OPEN_WEBUI:-ghcr.io/open-webui/open-webui:v0.12.5}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      WEBUI_ADMIN_EMAIL: ${OPEN_WEBUI_ADMIN_EMAIL:?must be set in .env (rendered by service_env._render_ollama)}
      WEBUI_ADMIN_PASSWORD: ${OPEN_WEBUI_ADMIN_PASSWORD:?must be set in .env (rendered by service_env._render_ollama)}
      WEBUI_ADMIN_NAME: "Nexus"
      # Signs sessions. Set explicitly: otherwise start.sh writes a random
      # one into the data directory, and a restored directory and a new
      # key would log everyone out.
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?must be set in .env (rendered by service_env._render_ollama)}
      WEBUI_URL: ${OPEN_WEBUI_URL:-}
      WEBUI_NAME: "Nexus AI"
      # The public side is HTTPS (Cloudflare).
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      # A bind mount, so the R2 snapshot covers chats, uploads and the
      # SQLite database and a rebuild teardown keeps them. It used to be
      # the named volume `open-webui-data`, which every rebuild teardown
      # destroyed; compose_runner copies a still-existing one into this
      # directory once, on a server that has it.
      - /mnt/nexus-data/open-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app-network
      - ollama-internal

volumes:
  ollama-data:

networks:
  app-network:
    external: true
  ollama-internal:
    # Treated as external on both sides (here and in stacks/litellm). The
    # deploy pipeline pre-creates `ollama-internal` whenever either stack
    # is enabled (see compose_runner.render_remote_script's
    # `ollama_internal_network_prep` block), so network ownership lives
    # outside both compose projects. This keeps the joint Ollama+LiteLLM
    # deployment deterministic — neither compose project tries to "own"
    # the network and race on creation.
    external: true
    name: ollama-internal
