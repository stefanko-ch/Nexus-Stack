# =============================================================================
# OpenSearch - search engine + Dashboards
# =============================================================================
# The Apache-2.0 fork of Elasticsearch 7.10, plus its Dashboards UI. Speaks
# the Elasticsearch REST API, so anything written against that API — the
# `opensearch-py` and `elasticsearch-py` clients, Logstash, Fluent Bit —
# works against it unchanged.
#
# Standalone on purpose. Marquez ships its own `marquez-opensearch` inside
# its stack and does NOT use this one: sharing it would mean Marquez's
# lineage search breaks the moment somebody disables OpenSearch, which is
# exactly what the project's "each stack brings its own resources" rule
# exists to prevent. The two are independent and cost ~1 GB each.
#
# Architecture:
#   - opensearch:            single node, REST API on :9200, security plugin
#                            ON so the API requires credentials
#   - opensearch-dashboards: the UI on :5601, the only published port
#
# Auth: Cloudflare Access at the edge is the gate, so Dashboards runs with
# its own security plugin disabled and no second login screen. The API
# itself keeps authentication, because notebooks and pipelines inside the
# stack reach it directly over app-network and a credential-free index is
# a footgun the moment more than one person uses it.
#
# Reaching the API from inside the stack (Jupyter, Marimo, code-server):
#   from opensearchpy import OpenSearch
#   client = OpenSearch(
#       hosts=[{"host": "opensearch", "port": 9200}],
#       http_auth=("admin", os.environ["OPENSEARCH_ADMIN_PASSWORD"]),
#       use_ssl=False,
#   )
#
# No host port is published for :9200 by design — zero open ports is the
# project's baseline. If an external client genuinely needs it, add a
# `tcp_ports` entry in services.yaml rather than a `ports:` line here, so
# the firewall rule is managed and reset on teardown like every other one.
#
# Access: https://opensearch.YOUR_DOMAIN
# Docs:   https://opensearch.org/docs/latest/
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OpenSearch - the node itself
  # ---------------------------------------------------------------------------
  opensearch:
    image: ${IMAGE_OPENSEARCH:-opensearchproject/opensearch:2.19.6}
    container_name: opensearch
    env_file:
      - .env
    restart: unless-stopped
    environment:
      # Single node: no seed hosts, no cluster-manager election. Without
      # this the node waits for peers that never arrive and never reports
      # a green cluster.
      - discovery.type=single-node
      - cluster.name=nexus-opensearch
      - node.name=opensearch
      - bootstrap.memory_lock=true
      # TLS off on the HTTP layer. The port is not published and the
      # traffic stays on app-network; leaving it on would force every
      # in-stack client to trust the bundled demo certificate, which is a
      # worse trade than terminating TLS at Cloudflare as the rest of the
      # stack does. Authentication stays on.
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # Mandatory since 2.12 and validated on start: at least one upper,
      # one lower, one digit and one special character, plus a zxcvbn
      # strength check. Generated by random_password.opensearch_admin with
      # `override_special = "-_."` so the value stays inert in a shell, a
      # compose .env parser and a YAML scalar.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    ulimits:
      # memory_lock above needs both of these. Without them the node still
      # starts but logs a warning and its heap can be paged out mid-query.
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          # Heap is capped at 1g above; the rest is off-heap plus Lucene's
          # file cache, which wants room to breathe.
          memory: 3g
    networks:
      - app-network
      - opensearch-internal
    healthcheck:
      # No credentials in the probe: a 401 proves as much as a 200 does —
      # the node is listening and its security plugin is loaded — and
      # passing the password would put it in the healthcheck process's
      # argument list, which the project forbids for secrets.
      #
      # No dollar sign either. An anchored regex would need one, and that
      # stacks two under-specified behaviours: docker compose's `$$`
      # escaping, and how a given grep treats a `$` that is not final.
      # `grep -qxF` needs neither and still rejects a stray 2001.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -qxF -e 200 -e 401"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ---------------------------------------------------------------------------
  # OpenSearch Dashboards - the UI
  # ---------------------------------------------------------------------------
  # Version must match the node's. Dashboards refuses to start against an
  # OpenSearch of a different minor and says so in its log.
  opensearch-dashboards:
    image: ${IMAGE_OPENSEARCH_DASHBOARDS:-opensearchproject/opensearch-dashboards:2.19.6}
    container_name: opensearch-dashboards
    env_file:
      - .env
    restart: unless-stopped
    environment:
      # The image's entrypoint maps a config key to an env var by
      # uppercasing it and turning dots into underscores, so
      # `opensearch.hosts` is OPENSEARCH_HOSTS and `opensearch.username`
      # is OPENSEARCH_USERNAME. The value is a JSON array, not a bare URL.
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      # `admin`, not `nexus-opensearch`, and this is a documented exception
      # to the project's service-account naming rule. The name is a compiled
      # constant in the security plugin's demo configurator
      # (SecuritySettingsConfigurer: `static String ADMIN_USERNAME = "admin"`)
      # with no environment override — OPENSEARCH_INITIAL_ADMIN_PASSWORD
      # replaces the password inside internal_users.yml and nothing else.
      # Renaming it means shipping our own internal_users.yml with a bcrypt
      # hash generated at deploy time plus a securityadmin.sh run.
      #
      # The rule exists to stop default-username guessing, which needs a
      # reachable endpoint. This one has no published port and no tcp_ports
      # entry, so it is only reachable from inside app-network, and the
      # password is 24 random characters. See docs/stacks/opensearch.md.
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # Removes the Dashboards login screen, because Cloudflare Access
      # already authenticated whoever got this far. The entrypoint also
      # rewrites https to http in the shipped config when this is set,
      # which is what makes the plain-HTTP host above work.
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_HOST=0.0.0.0
    ports:
      # Bound to 0.0.0.0 like every other stack here, and that is safe for
      # the same reason: hcloud_firewall.main ships with no inbound rules
      # at all ("Zero Entry — all traffic via Cloudflare Tunnel"), and it
      # is a cloud firewall outside the host, so Docker's iptables rules
      # cannot punch through it the way they bypass a host-local UFW.
      # Binding 127.0.0.1 instead would also silently break a future
      # `tcp_ports` entry, which needs 0.0.0.0 to be reachable at all.
      #
      # ⚠️ Do NOT add a `tcp_ports` entry for 5601. That opens the Hetzner
      # firewall, and Dashboards has no login of its own — its security
      # plugin is off because Cloudflare Access is the gate, so an open
      # 5601 is an unauthenticated UI on the public internet. If something
      # external needs this stack, expose 9200 instead: the API keeps its
      # authentication.
      - "5601:5601"
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - app-network
      - opensearch-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qxF -e 200 -e 401"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  opensearch-data:

networks:
  app-network:
    external: true
  opensearch-internal:
    driver: bridge
