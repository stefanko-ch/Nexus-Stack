# =============================================================================
# Arize Phoenix - tracing and evaluation for LLM applications
# =============================================================================
# URL: https://phoenix.<domain>
# In-cluster: http://phoenix:6006/v1/traces (OTLP over HTTP), phoenix:4317 (OTLP gRPC)
#
# Collects OpenTelemetry traces from LLM applications (LangChain,
# LlamaIndex, OpenAI SDK, ... through the OpenInference instrumentations),
# shows each call with its prompt, response, tokens and latency, and runs
# evaluations and experiments over datasets of examples. Next to langfuse it
# is the second LLM observability tool; Phoenix leans towards evaluation.
#
# Authentication is on. Phoenix creates the admin admin@localhost with the
# generated password from Infisical (folder `phoenix`) on the first start,
# and asks for a new password at the first login. Sending traces needs an
# API key, created in the UI under Settings.
#
# Licence: Elastic License 2.0, not an OSI licence; self-hosting is
# permitted, offering Phoenix as a managed service is not. Its web
# analytics are off.
#
# Data in the phoenix-data volume (SQLite), which survives a restart and the
# snapshot lifecycle, not a rebuild teardown.
# =============================================================================

services:
  phoenix:
    image: ${IMAGE_PHOENIX:-arizephoenix/phoenix:version-20.26.1}
    container_name: phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8142:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_ENABLE_AUTH: "true"
      # Signs session tokens; at least 32 characters with a digit and a
      # lowercase letter.
      PHOENIX_SECRET: ${PHOENIX_SECRET:?must be set in .env (rendered by service_env._render_phoenix)}
      # Read on the first start only, when admin@localhost is created.
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?must be set in .env (rendered by service_env._render_phoenix)}
      PHOENIX_ROOT_URL: ${PHOENIX_URL:?must be set in .env (rendered by service_env._render_phoenix)}
      PHOENIX_USE_SECURE_COOKIES: "true"
      # Without it Phoenix does not check the Origin header at all.
      PHOENIX_CSRF_TRUSTED_ORIGINS: ${PHOENIX_URL}
      # FullStory and Scarf analytics in the web UI.
      PHOENIX_TELEMETRY_ENABLED: "false"
    volumes:
      - phoenix-data:/data
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      # Distroless image: no shell, curl or wget, but Python.
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-network

volumes:
  phoenix-data:

networks:
  app-network:
    external: true
