# =============================================================================
# PostgREST - Auto-generated REST API for any Postgres schema
# =============================================================================
# Single Go binary that reads a Postgres schema and exposes every
# table / view / RPC as a REST endpoint with negotiated content types
# (JSON, CSV, OpenAPI). Zero schema definitions in PostgREST itself —
# the API surface IS the database surface. Common workflow:
#
#   1. Operator creates tables in the shared `postgres` stack
#      (via CloudBeaver / pgAdmin / Adminer / psql).
#   2. PostgREST serves them at https://postgrest.YOUR_DOMAIN/<table>
#      with HTTP filtering (`?col=eq.x`), pagination (`Range` header),
#      ordering (`?order=col.desc`), and embedded resources (`?select=*,fk(*)`).
#   3. PostgREST's `/` returns the auto-generated OpenAPI spec —
#      paste it into Hoppscotch / any Swagger UI to explore.
#
# Auth: JWT-based on the PostgREST side (PGRST_JWT_SECRET signs tokens
# that carry the Postgres role to impersonate). Cloudflare Access at
# the edge gates *who* reaches the endpoint, with email-OTP login.
# For the educational lab setup here we point the anon role at the
# shared-postgres superuser; tightening to a dedicated `web_anon`
# role with restricted GRANTs is the right production hardening step
# but is left to the operator.
#
# Access: https://postgrest.YOUR_DOMAIN
# =============================================================================

services:
  postgrest:
    image: ${IMAGE_POSTGREST:-postgrest/postgrest:v14.12}
    container_name: postgrest
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "3009:3000"
    environment:
      # Connection to the shared postgres stack on app-network.
      # POSTGRES_PASSWORD comes from .env (rendered by the
      # service_env hook from NexusConfig.postgres_password — the
      # same shared-postgres secret the `postgres` stack itself uses).
      PGRST_DB_URI: postgres://nexus-postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      # Which schemas to expose. Defaults to `public` — operator can
      # add comma-separated schemas via the Control Plane env-edit
      # flow without touching this compose file.
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      # The role PostgREST switches to for anonymous (no JWT) requests.
      # nexus-postgres has full access to the shared DB — fine for
      # the lab setup; tighten to a least-privilege role for prod by
      # setting PGRST_DB_ANON_ROLE=web_anon in the stack .env.
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-nexus-postgres}
      # HS256 secret used to verify JWT bearer tokens that elevate
      # past the anon role. Generated by `random_password.postgrest_jwt_secret`,
      # stored in Infisical under `/postgrest/POSTGREST_JWT_SECRET`.
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      # External URL embedded in the generated OpenAPI spec so the
      # Swagger UI's "Try it out" buttons hit the right host.
      PGRST_OPENAPI_SERVER_PROXY_URI: https://postgrest.${DOMAIN}
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - app-network
    healthcheck:
      # PostgREST returns 200 at / with the OpenAPI doc when the DB
      # connection is healthy. Schema-only check, no row scan.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  app-network:
    external: true
