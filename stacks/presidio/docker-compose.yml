# =============================================================================
# Microsoft Presidio - PII detection and anonymization APIs
# =============================================================================
# In-cluster: http://presidio-analyzer:3000    (find PII in text; `presidio` too)
#             http://presidio-anonymizer:3000  (mask, replace, hash, encrypt)
#
# Presidio finds personal data (names, email addresses, phone numbers,
# IBANs, credit cards, ...) with NER models and pattern recognizers, and
# replaces it. For data-governance and GDPR lessons, and in front of LLM
# pipelines so prompts carry no personal data.
#
# Two REST APIs without authentication and without a web UI, so the stack is
# internal only (`internal_only` in services.yaml): notebooks, Kestra flows
# and other containers on app-network call it.
#
# Stateless: no volumes.
# =============================================================================

services:
  presidio-analyzer:
    image: ${IMAGE_PRESIDIO:-mcr.microsoft.com/presidio-analyzer:2.2.362}
    # Named after the services.yaml key, which compose_runner looks for;
    # the service name presidio-analyzer resolves on app-network as well.
    container_name: presidio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  presidio-anonymizer:
    image: ${IMAGE_PRESIDIO_ANONYMIZER:-mcr.microsoft.com/presidio-anonymizer:2.2.362}
    container_name: presidio-anonymizer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

networks:
  app-network:
    external: true
