# Qdrant — vector database with a built-in web dashboard
# https://qdrant.<domain>/dashboard
#
# Third vector store, next to Chroma and Weaviate. Chroma is the small
# embedded-style store tutorials start with; Weaviate is the schema-first
# one with hybrid BM25 + vector search and no UI. Qdrant is the one with a
# dashboard: collections, points and payloads can be browsed and queried
# from the browser, and its payload filtering and quantization options are
# what an index looks like when memory and latency start to matter.
#
# Auth: unlike Chroma and Weaviate, this stack turns the application's own
# API key on. Cloudflare Access is still the outer gate for the browser;
# the key is what stops every other container on app-network from reading
# or deleting collections, which is the posture the Weaviate docs state
# plainly as that stack's cost. The key is generated by OpenTofu
# (random_password.qdrant_api_key) and stored in Infisical under folder
# `qdrant`, key `QDRANT_API_KEY`. The dashboard asks for it once and keeps
# it in the browser's local storage.
#
# An EMPTY key does not fail. Measured on v1.19.1: Qdrant logs "api_key is
# set but empty, it is treated as unset" and /collections then answers 200
# without a key. That is why the variable uses `:?` here and _render_qdrant
# fails fast, rather than trusting the container to refuse.
#
# Docs: https://qdrant.tech/documentation/

services:
  qdrant:
    image: ${IMAGE_QDRANT:-qdrant/qdrant:v1.19.1}
    container_name: qdrant
    restart: unless-stopped
    ports:
      # REST API and the dashboard share one port. Bound to 127.0.0.1:
      # cloudflared connects to `http://localhost:<port>` (tofu/stack/main.tf),
      # so nothing is lost, and #742 tracks the stacks that still publish
      # on every interface.
      #
      # gRPC (6334) is deliberately NOT published. It cannot go through the
      # HTTPS tunnel as a plain ingress rule, and in-cluster clients reach it
      # at `qdrant:6334` over app-network without a host binding — the same
      # arrangement as Weaviate's gRPC port.
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?must be set in .env (rendered by service_env._render_qdrant)}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
      # Collection snapshots are written to /qdrant/snapshots, outside the
      # storage directory. Without a volume they would live in the
      # container's writable layer and vanish on the next recreate — a
      # snapshot that disappears is worse than none.
      - qdrant_snapshots:/qdrant/snapshots
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      # This image ships neither curl nor wget (verified with `command -v`
      # inside v1.19.1), but it does ship bash, so the probe speaks HTTP
      # over bash's /dev/tcp. A curl or wget probe would leave the container
      # permanently unhealthy while it works — the defect #783 fixed.
      #
      # /readyz is exempt from the API key and answers 200 once the node can
      # serve. The status line is checked, not just the TCP connect, so a
      # 401 (auth misconfigured on an authenticated path) or 503 counts as a
      # failure.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

volumes:
  qdrant_storage:
  qdrant_snapshots:

networks:
  app-network:
    external: true
