# =============================================================================
# Unity Catalog metastore
# =============================================================================
# Mounted over the image's own copy. One line differs from upstream and it
# matters: the connection URL.
#
# Upstream ships `jdbc:h2:file:./etc/db/h2db`, a path relative to the
# working directory. Their compose persists only /opt/unitycatalog/etc/data,
# so the metastore lands OUTSIDE the volume — every catalog, schema and
# table registration would be lost on the next `--force-recreate`, which
# this project does on every spin-up.
#
# Pointing it into the mounted data directory is what makes the catalog
# survive a deploy.
# =============================================================================
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:file:/opt/unitycatalog/etc/data/h2db;DB_CLOSE_DELAY=-1
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.use_sql_comments=true
org.hibernate.SQL=INFO
org.hibernate.type.descriptor.sql.BasicBinder=TRACE
