# =============================================================================
# Unity Catalog server
# =============================================================================
# Mounted over the image's own copy so the settings below are explicit
# rather than inherited defaults that could shift on an image bump.
#
# authorization=disable is deliberate and matches Lakekeeper and Marquez:
# Cloudflare Access at the edge is this project's gate for the published UI
# route, and Unity Catalog's own auth expects an external OIDC provider that
# the stack does not run.
#
# Be precise about what that protects. Access covers the browser route to
# unity-catalog.<domain>. It does NOT cover the API, which sits on
# app-network with no published port: every other container in the
# deployment can call http://unitycatalog:8080 directly, with no
# credentials and no Access session. That is deliberate — it is how Spark
# and the notebooks reach the catalog — but it means the boundary is the
# Docker network, not Access. Anything with a foothold in the stack has
# full read and write on this catalog.
# =============================================================================
server.env=prod
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
server.client-secret=
server.redirect-port=
server.allowed-issuers=
server.audiences=
server.cookie-timeout=P5D
server.access-token-timeout=PT24H

# S3 / object storage — intentionally left empty.
#
# Unity Catalog can register external tables on S3, and this stack has four
# candidates (MinIO, Garage, RustFS, SeaweedFS). Wiring one in here would
# make Unity Catalog fail whenever that stack is disabled, which is what
# the project's "each stack brings its own resources" rule exists to
# prevent. Fill these in deliberately if you want external tables; see
# docs/stacks/unity-catalog.md.
aws.masterRoleArn=
aws.accessKey=
aws.secretKey=
aws.region=
s3.bucketPath.0=
s3.region.0=
s3.awsRoleArn.0=
s3.accessKey.0=
s3.secretKey.0=
