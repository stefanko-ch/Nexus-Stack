# =============================================================================
# Unity Catalog server — the STATIC half of the configuration
# =============================================================================
# Baked into the image by the Dockerfile as `server.properties.base`, and copied
# into place by entrypoint.sh on every container start, which then appends the
# per-deployment `s3.*` block. Nothing under etc/conf is bind-mounted; see the
# comment block at the top of entrypoint.sh for why.
#
# The settings below are stated explicitly rather than inherited, so an image
# bump cannot shift them silently.
#
# authorization=disable is deliberate and matches Lakekeeper and Marquez:
# Cloudflare Access at the edge is this project's gate for the published UI
# route, and Unity Catalog's own auth expects an external OIDC provider that
# the stack does not run.
#
# Be precise about what that protects. Access covers the browser route to
# unity-catalog.<domain>. It does NOT cover the API, which sits on
# app-network with no published port: every other container in the
# deployment can call http://unitycatalog:8080 directly, with no
# credentials and no Access session. That is deliberate — it is how Spark
# and the notebooks reach the catalog — but it means the boundary is the
# Docker network, not Access. Anything with a foothold in the stack has
# full read and write on this catalog.
# =============================================================================
server.env=prod
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
server.client-secret=
server.redirect-port=
server.allowed-issuers=
server.audiences=
server.cookie-timeout=P5D
server.access-token-timeout=PT24H

# S3 / object storage is NOT configured here.
#
# entrypoint.sh appends the `s3.*` block at container start, pointing at the
# deployment's Cloudflare R2 data bucket. R2 rather than one of this stack's
# four in-cluster object stores (MinIO, Garage, RustFS, SeaweedFS) because
# table data has to survive a rebuild teardown, and the server's own disk does
# not — which is the whole reason the catalog is worth having.
#
# Empty keys are not merely redundant here, they are indistinguishable from
# absent ones: readPropertiesFromFile drops every entry whose value trims to
# empty (ServerProperties.java:310, "Remove empty values"), so the block that
# used to sit here was doing nothing at all.
#
# The master-role keys stay unset on purpose. They configure a UC-wide AWS
# identity for assuming storage roles, which R2 has no equivalent of; the
# per-bucket credential generator named in the appended block does the vending
# instead. See docs/stacks/unity-catalog.md.
